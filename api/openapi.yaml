        contatti a lotti al ritorno della connessione: id_client, generato dall’app, rende l’invio sicuro da ripetere.
        Si accettano solo contatti da maggiorenni. Alla ricezione il server controlla il biglietto: se risulta ridotto,
        gratuito per bambini o con fascia d’età minorile il contatto non si conserva, l’esito è «scartato» con motivo
        MINORE_NON_AMMESSO e si registra un’anomalia senza dati personali. Per un biglietto sconosciuto o senza
        fascia d’età il contatto si conserva solo con la dichiarazione di maggiore età e l’informativa, e resta
        «in verifica» (non visibile all’espositore) finché il biglietto non è noto: i biglietti venduti durante
        la fiera arrivano con il file di fine giornata. Nessun contatto di un minorenne deve arrivare all’espositore
        (confermato dal cliente). Un espositore può inviare contatti solo per il proprio stand. La risposta non
        restituisce dati personali. La soluzione per l’uso senza rete è approvata dal cliente.'
      x-ruoli:
      - espositore
      x-stato: proposta
      x-domande:
      - 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvioContatti'
      responses:
        '200':
          description: Esito di ogni contatto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RisultatoContatti'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '422':
          $ref: '#/components/responses/NonElaborabile'
  /edizioni/{id_edizione}/biglietti/esclusioni-contatto:
    get:
      tags:
      - Scansione allo stand
      operationId: leggiEsclusioniContatto
      summary: Elenco dei codici per cui non proporre il contatto
      description: 'Serve all’app per decidere senza rete. Contiene solo codici di biglietto, senza dati personali:
        biglietti ridotti, gratuiti per bambini, con fascia d’età minorile o di tipo family, per cautela sui minori (nel 2025 circa il 36,9% dei biglietti senza i family, circa il 43,7% con i family).
        Il solo tipo di biglietto non basta, perché un minorenne può avere un biglietto intero. I biglietti venduti
        durante la fiera (nel 2025 il 24% dall’apertura in poi) non sono nell’elenco fino al file di fine giornata:
        per quei codici, e per quelli senza fascia d’età, vale la regola di POST /contatti. L’app lo scarica prima
        della fiera e lo riscarica quando c’è rete: per ora l’elenco è sempre completo e il parametro «da» non è usato. Il parametro «giorno» riduce i dati sul
        telefono.'
      x-ruoli:
      - espositore
      x-stato: proposta
      parameters:
      - $ref: '#/components/parameters/IdEdizione'
      - name: da
        in: query
        description: Non ancora usato. Per ora l’elenco restituito è sempre completo.
        schema:
          type: string
          format: date-time
      - name: giorno
        in: query
        description: Solo i biglietti validi in quel giorno, abbonamenti compresi.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: I codici da escludere.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsclusioniContatto'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
  /informativa/corrente:
    get:
      tags:
      - Scansione allo stand
      operationId: leggiInformativaCorrente
      summary: Legge l’informativa in vigore
      description: L’app la scarica, la conserva per l’uso senza rete e la mostra prima di raccogliere un contatto.
        Il contatto registra quale informativa è stata mostrata, per poter dimostrare quando, a quale stand e con
        quale informativa è stato dato il consenso.
      x-ruoli:
      - espositore
      responses:
        '200':
          description: L’informativa da mostrare al visitatore.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Informativa'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token con le informazioni «ruolo» (direzione, commerciale, direttore_commerciale, amministrazione,
        staff, espositore, amministratore) e, per gli espositori, «id_espositore». Come si autenticano gli utenti,
        in particolare gli espositori, è un punto aperto del progetto.
    credenzialeServizio:
      type: http
      scheme: bearer
      description: 'Credenziale di servizio, per il sistema dei varchi (invio delle letture) e per i flussi automatici
        (solleciti). Non è un utente della tabella utente: da confermare con il BID.'
  parameters:
    IdEdizione:
      name: id_edizione
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 2024
      description: Anno dell’edizione.
    IdEspositore:
      name: id_espositore
      in: path
      required: true
      schema:
        type: string
        pattern: ^ESP[0-9]{3,}$
    IdContratto:
      name: id_contratto
      in: path
      required: true
      schema:
        type: string
        pattern: ^C[0-9]{4}-[0-9]{4}$
    IdPreventivo:
      name: id_preventivo
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdPagamento:
      name: id_pagamento
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPagina:
      name: per_pagina
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    RichiestaNonValida:
      description: Richiesta non valida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    NonAutenticato:
      description: Token assente o scaduto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    NonAutorizzato:
      description: Il ruolo non può eseguire l’operazione, oppure l’espositore chiede dati di un altro espositore.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    NonTrovato:
      description: Risorsa non trovata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    Conflitto:
      description: La richiesta contrasta con lo stato attuale (per esempio stand non disponibile).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
    NonElaborabile:
      description: La richiesta è corretta ma viola una regola (per esempio fuori termine, sconto oltre soglia,
        minore).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errore'
  schemas:
    Errore:
      type: object
      required:
      - codice
      - messaggio
      properties:
        codice:
          type: string
          description: 'Codice stabile leggibile dalle macchine: per esempio STAND_NON_DISPONIBILE, STAND_IN_PRELAZIONE,
            SCONTO_OLTRE_SOGLIA, SPONSORIZZAZIONE_ESAURITA, SPONSORIZZAZIONE_RISERVATA, FUORI_TERMINE, AZIONE_NON_DOVUTA,
            MINORE_NON_AMMESSO, VENDITE_CHIUSE.'
          example: STAND_NON_DISPONIBILE
        messaggio:
          type: string
          example: Lo stand P1-A02 è già opzionato per l’edizione 2026.
        dettagli:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              motivo:
                type: string
    Pagina:
      type: object
      required:
      - pagina
      - per_pagina
      - totale
      properties:
        pagina:
          type: integer
          minimum: 1
        per_pagina:
          type: integer
          minimum: 1
          maximum: 200
        totale:
          type: integer
          minimum: 0
    Edizione:
      type: object
      required:
      - id_edizione
      - nome
      - data_inizio
      - data_fine
      properties:
        id_edizione:
          type: integer
          format: int32
          example: 2026
        nome:
          type: string
          example: ARCADE Milano 2026
        data_inizio:
          type: string
          format: date
          example: '2026-12-18'
        data_fine:
          type: string
          format: date
          example: '2026-12-20'
        scadenza_prelazione:
          type: string
          format: date
          description: Fino a questa data (31 marzo) uno stand può essere opzionato solo dall’espositore che lo
            aveva l’anno prima. Per il 2026 è il 2026-03-31 (già passata).
          example: '2026-03-31'
          nullable: true
        scadenza_saldo:
          type: string
          format: date
          description: 'Calcolata: 30 giorni prima dell’apertura. Per il 2026, 2026-11-18.'
          example: '2026-11-18'
        scadenza_cambio_stand:
          type: string
          format: date
          description: 'Calcolata: 60 giorni prima dell’apertura. Per il 2026, 2026-10-19 (già passata).'
          example: '2026-10-19'
        scadenza_disdetta_con_acconto:
          type: string
          format: date
          description: 'Calcolata: 90 giorni prima dell’apertura. Per il 2026, 2026-09-19 (già passata).'
          example: '2026-09-19'
        chiusura_vendite:
          type: string
          format: date
          description: 'Parametro dell’edizione: 15 giorni prima dell’apertura (per il 2026, 2026-12-03). Dopo questa
            data non si creano né si inviano preventivi e non si firmano contratti.'
          example: '2026-12-03'
    Padiglione:
      type: object
      required:
      - codice_padiglione
      - nome
      properties:
        codice_padiglione:
          type: string
          enum:
          - P1
          - P2
          - P3
        nome:
          type: string
          example: Console & PC
    StatoStand:
      type: string
      enum:
      - libero
      - opzionato
      - in_prelazione
      - venduto
    Stand:
      type: object
      required:
      - codice_stand
      - codice_padiglione
      - mq
      - posizione
      - attivo_dal
      - stato
      properties:
        codice_stand:
          type: string
          pattern: ^P[1-3]-[A-Z][0-9]{2}$
          example: P1-A01
        codice_padiglione:
          type: string
          enum:
          - P1
          - P2
          - P3
        mq:
          type: number
          minimum: 0.1
          example: 36
        posizione:
          type: string
          enum:
          - linea
          - angolo
          - penisola
          - isola
        attivo_dal:
          type: integer
          format: int32
          example: 2024
        stato:
          allOf:
          - $ref: '#/components/schemas/StatoStand'
          description: Calcolato per l’edizione richiesta.
        id_contratto:
          type: string
          description: Valorizzato se lo stand è venduto.
          nullable: true
        id_preventivo:
          type: integer
          format: int64
          description: Valorizzato se lo stand è opzionato.
          nullable: true
    TipoVoce:
      type: string
      enum:
      - spazio
      - maggiorazione
      - sponsorizzazione
      - extra
      - condizione
    VoceListino:
      type: object
      required:
      - id_edizione
      - codice_voce
      - descrizione
      - tipo_voce
      properties:
        id_edizione:
          type: integer
          format: int32
        codice_voce:
          type: string
          example: SPAZIO-P1
        descrizione:
          type: string
        tipo_voce:
          $ref: '#/components/schemas/TipoVoce'
        unita:
          type: string
          example: m²
          nullable: true
        prezzo_unitario:
          type: number
          format: decimal
          multipleOf: 0.01
          description: Per le maggiorazioni e per l’acconto è una frazione (0,10, 0,15, 0,25, 0,30), non un importo.
            Vuoto solo per la prelazione.
          minimum: 0
          nullable: true
        quantita_disponibile:
          type: integer
          minimum: 0
          nullable: true
        quantita_residua:
          type: integer
          minimum: 0
          description: 'Calcolata: disponibile meno già venduta nell’edizione. Esaurita non si può più proporre.'
          nullable: true
        codice_padiglione_vincolo:
          type: string
          enum:
          - P1
          - P2
          - P3
          description: 'Padiglione a cui è riservata la voce: P3 per l’Indie Showcase, dal 2026. Lo storico resta
            com’è (confermato dal cliente).'
          nullable: true
        disponibilita:
          type: string
          example: da planimetria
          nullable: true
        note:
          type: string
          nullable: true
    Espositore:
      type: object
      required:
      - id_espositore
      - ragione_sociale
      - partita_iva
      properties:
        id_espositore:
          type: string
          pattern: ^ESP[0-9]{3,}$
          example: ESP001
        ragione_sociale:
          type: string
        partita_iva:
          type: string
          pattern: ^[0-9]{11}$
          description: 'Sempre testo di 11 cifre: gli zeri iniziali contano.'
          example: '01965569816'
        settore:
          type: string
          nullable: true
        citta:
          type: string
          nullable: true
        referente:
          type: string
          description: Dato personale, visibile solo a commerciale e amministrazione.
          nullable: true
        email_referente:
          type: string
          format: email
          description: Dato personale, visibile solo a commerciale e amministrazione.
          nullable: true
    NuovoEspositore:
      type: object
      required:
      - ragione_sociale
      - partita_iva
      properties:
        ragione_sociale:
          type: string
        partita_iva:
          type: string
          pattern: ^[0-9]{11}$
          description: 'Sempre testo di 11 cifre: gli zeri iniziali contano.'
          example: '01965569816'
        settore:
          type: string
          nullable: true
        citta:
          type: string
          nullable: true
        referente:
          type: string
          description: Dato personale, visibile solo a commerciale e amministrazione.
          nullable: true
        email_referente:
          type: string
          format: email
          description: Dato personale, visibile solo a commerciale e amministrazione.
          nullable: true
    StatoRinnovo:
      type: string
      enum:
      - da_proporre
      - preventivo_inviato
      - rinnovato
    Rinnovo:
      type: object
      required:
      - id_espositore
      - ragione_sociale
      - id_contratto_precedente
      - codice_stand_precedente
      - stato
      properties:
        id_espositore:
          type: string
        ragione_sociale:
          type: string
        id_contratto_precedente:
          type: string
        codice_stand_precedente:
          type: string
        stato:
          $ref: '#/components/schemas/StatoRinnovo'
    StatoPreventivo:
      type: string
      enum:
      - bozza
      - in_approvazione
      - inviato
      - accettato
      - perso
      - scaduto
      description: I sei stati usati dal cliente. «In approvazione» quando lo sconto supera il 10%. «Scaduto» dopo
        30 giorni dall’invio.
    RigaDocumento:
      type: object
      required:
      - riga
      - codice_voce
      - quantita
      - prezzo_unitario
      - importo_eur
      properties:
        riga:
          type: integer
          minimum: 1
        codice_voce:
          type: string
          example: EX-EL6
        descrizione:
          type: string
          example: Allaccio elettrico
          nullable: true
        quantita:
          type: number
          minimum: 0
        prezzo_unitario:
          type: number
          format: decimal
          multipleOf: 0.01
          description: Per la maggiorazione è l’importo calcolato (percentuale per il costo dell’area), non la percentuale
            del listino.
        importo_eur:
          type: number
          format: decimal
          multipleOf: 0.01
          description: Quantità per prezzo unitario.
    RigaPreventivoInput:
      type: object
      required:
      - codice_voce
      - quantita
      properties:
        codice_voce:
          type: string
          description: Una voce EX- o SP- del listino dell’edizione.
          example: SP-SOCIAL
        quantita:
          type: number
          minimum: 0
          exclusiveMinimum: true
    NuovoPreventivo:
      type: object
      required:
      - id_edizione
      - id_espositore
      - codice_stand
      properties:
        id_edizione:
          type: integer
          format: int32
        id_espositore:
          type: string
        codice_stand:
          type: string
          pattern: ^P[1-3]-[A-Z][0-9]{2}$
        righe:
          type: array
          items:
            $ref: '#/components/schemas/RigaPreventivoInput'
          description: Solo extra e sponsorizzazioni.
        sconto_pct:
          type: number
          minimum: 0
          maximum: 0.2
          default: 0
          description: Frazione tra 0 e 0,2 (0,1 = 10%). Fino a 0,10 decide il commerciale; da 0,10 a 0,20 serve
            il direttore commerciale. Comprende l’eventuale sconto fedeltà del 5%.
        aliquota_iva:
          type: number
          minimum: 0
          maximum: 1
          default: 0.22
          description: 'Di norma 22%. Per le aziende estere la decide l’amministrazione: solo il suo ruolo può modificarla.'
    Preventivo:
      type: object
      required:
      - id_preventivo
      - id_edizione
      - id_espositore
      - codice_stand
      - data_creazione
      - stato
      - imponibile_listino_eur
      - sconto_pct
      - imponibile_eur
      - aliquota_iva
      properties:
        id_preventivo:
          type: integer
          format: int64
        id_edizione:
          type: integer
          format: int32
        id_espositore:
          type: string
        codice_stand:
          type: string
        data_creazione:
          type: string
          format: date
        inviato_il:
          type: string
          format: date-time
          nullable: true
        valido_fino:
          type: string
          format: date
          description: 30 giorni dopo l’invio.
          nullable: true
        imponibile_listino_eur:
          type: number
          format: decimal
          multipleOf: 0.01
          description: Somma delle righe.
        sconto_pct:
          type: number
          minimum: 0
          maximum: 0.2
        imponibile_eur:
          type: number
          format: decimal
          multipleOf: 0.01
          description: Importo dopo lo sconto, senza IVA.
        aliquota_iva:
          type: number
          minimum: 0
          maximum: 1
        iva_eur:
          type: number
          format: decimal
          multipleOf: 0.01
          description: 'Calcolata: imponibile per aliquota.'
        totale_eur:
          type: number
          format: decimal
          multipleOf: 0.01
          description: 'Calcolato: imponibile più IVA.'
        stato:
          $ref: '#/components/schemas/StatoPreventivo'
        in_prelazione:
          type: boolean
          readOnly: true
          description: 'Indica lo sconto fedeltà del 5%. Calcolato dal server: vero se l’espositore rinnova (anche
            cambiando stand) e il preventivo è creato entro la scadenza della prelazione (31 marzo). Non è la prelazione
            sullo stesso stand.'
        approvato_da:
          type: integer
          format: int64
          nullable: true
        approvato_il:
          type: string
          format: date-time
          nullable: true
        id_contratto:
          type: string
          nullable: true
        righe:
          type: array
          items:
            $ref: '#/components/schemas/RigaDocumento'
        in_approvazione_dal:
          type: string
          format: date-time
          nullable: true
          description: Momento in cui il preventivo è andato in approvazione.
    InvioPreventivo:
      type: object
      properties:
        destinatario:
          type: string
          format: email
          description: Se assente, l’e-mail del referente dell’espositore.
    DecisioneApprovazione:
      type: object
      required:
      - esito
      properties:
        esito:
          type: string
          enum:
          - approvato
          - respinto
        motivo:
          type: string
          maxLength: 500
    FirmaContratto:
      type: object
      properties:
        data_firma:
          type: string
          format: date
          description: Se assente, la data di oggi.
    Variazione:
      type: object
      required:
      - id_variazione
      - tipo
      - richiesta_il
      properties:
        id_variazione:
          type: integer
          format: int64
        tipo:
          type: string
          enum:
          - cambio_stand
          - disdetta
        richiesta_il:
          type: string
          format: date
        codice_stand_precedente:
          type: string
          nullable: true
        codice_stand_nuovo:
          type: string
          nullable: true
        differenza_eur:
          type: number
          format: decimal
          multipleOf: 0.01
          description: 'Cambio stand: positiva se l’espositore paga, negativa se recupera. Si somma al saldo.'
          nullable: true
        conguaglio_fuori_piattaforma:
          type: boolean
          description: 'Vero se il saldo era già pagato: la differenza la gestisce l’amministrazione fuori dalla
            piattaforma.'
    CambioStand:
      type: object
      required:
      - codice_stand_nuovo
      properties:
        codice_stand_nuovo:
          type: string
          pattern: ^P[1-3]-[A-Z][0-9]{2}$
        richiesta_il:
          type: string
          format: date
          description: Se assente, la data di oggi.
    Disdetta:
      type: object
      properties:
        richiesta_il:
          type: string
          format: date
          description: Se assente, la data di oggi.
    EsitoDisdetta:
      type: object
      required:
      - contratto
      - importo_dovuto_eur
      - disdetta_tempestiva
      properties:
        contratto:
          $ref: '#/components/schemas/Contratto'
        disdetta_tempestiva:
          type: boolean
          description: Vero se la richiesta è entro 90 giorni dall’apertura.
        importo_dovuto_eur:
          type: number
          format: decimal
          multipleOf: 0.01
          description: Con la disdetta tempestiva è l’acconto, altrimenti l’intero importo del contratto.
    Contratto:
      type: object
      required:
      - id_contratto
      - id_edizione
      - id_espositore
      - codice_stand
      - data_firma
      - imponibile_listino_eur
      - sconto_pct
      - imponibile_eur
      - rinnovo
      - stato
      properties:
        id_contratto:
          type: string
          pattern: ^C[0-9]{4}-[0-9]{4}$
          example: C2026-0001
        id_edizione:
          type: integer
          format: int32
        id_espositore:
          type: string
        id_preventivo:
          type: integer
          format: int64
          description: Vuoto per i 198 contratti storici.
          nullable: true
        codice_stand:
          type: string
        data_firma:
          type: string
          format: date
        imponibile_listino_eur:
          type: number
          format: decimal
          multipleOf: 0.01
        sconto_pct:
          type: number
          minimum: 0
          maximum: 0.2
        imponibile_eur:
          type: number
          format: decimal
          multipleOf: 0.01
        aliquota_iva:
          type: number
          minimum: 0
          maximum: 1
          description: Vuota per i contratti storici, dove esiste solo l’imponibile.
          nullable: true
        iva_eur:
          type: number
          format: decimal
          multipleOf: 0.01
          nullable: true
        totale_eur:
          type: number
          format: decimal
          multipleOf: 0.01
          nullable: true
        rinnovo:
          type: boolean
          description: 'Presente all’edizione precedente, anche su uno stand diverso. Nel 2024 è sempre falso: è
            la prima edizione con dati.'
        metodo_abbinamento:
          type: string
          enum:
          - id da sistema sorgente
          - nome normalizzato
          - somiglianza
          nullable: true
        stato:
          type: string
          enum:
          - attivo
          - disdetto
        disdetto_il:
          type: string
          format: date
          nullable: true
        deroga_allestimento_il:
          type: string
          format: date
          nullable: true
        deroga_allestimento_da:
          type: integer
          format: int64
          nullable: true
        allestimento_consentito:
          type: boolean
          description: 'Calcolato: vero se il saldo è pagato oppure esiste una deroga.'
        righe:
          type: array
          items:
            $ref: '#/components/schemas/RigaDocumento'
        pagamenti:
          type: array
          items:
            $ref: '#/components/schemas/Pagamento'
        variazioni:
          type: array
          items:
            $ref: '#/components/schemas/Variazione'
    StatoPagamento:
      type: string
      enum:
      - da_pagare
      - scaduto
      - pagato_nei_termini
      - pagato_in_ritardo
      description: 'Calcolato. «Scaduto» vale per qualunque edizione: un saldo senza data oltre la scadenza è un
        credito aperto.'
    Pagamento:
      type: object
      required:
      - id_pagamento
      - id_contratto
      - tipo
      - scadenza
      - importo
      - stato
      properties:
        id_pagamento:
          type: integer
          format: int64
        id_contratto:
          type: string
        tipo:
          type: string
          enum:
          - acconto
          - saldo
        scadenza:
          type: string
          format: date
          description: 'Acconto: 15 giorni dopo la firma. Saldo: 30 giorni prima dell’apertura. Se la scadenza dell’acconto
            cadrebbe dopo quella del saldo, entrambe sono 15 giorni prima dell’apertura (per il 2026, 2026-12-03).'
        pagato_il:
          type: string
          format: date
          nullable: true
        importo:
          type: number
          format: decimal
          multipleOf: 0.01
          description: 'Acconto: 30% dell’imponibile del contratto. Saldo: il resto. Sull’imponibile, senza IVA
            (confermato dal cliente). Con un cambio stand l’acconto resta e il saldo si ricalcola, se non è già
            pagato.'
          minimum: 0
        stato:
          $ref: '#/components/schemas/StatoPagamento'
        data_dedotta:
          type: boolean
          description: Vero per gli 8 acconti storici incassati alla data del saldo.
        annullato:
          type: boolean
          description: Vero per il saldo annullato dopo una disdetta tempestiva.
        solleciti_inviati:
          type: integer
          minimum: 0
    RegistraPagamento:
      type: object
      required:
      - pagato_il
      properties:
        pagato_il:
          type: string
          format: date
    TipoSollecito:
      type: string
      enum:
      - promemoria
      - sollecito
      - passaggio_amministrazione
      description: 'Calendario: promemoria 7 giorni prima della scadenza, sollecito il giorno dopo, passaggio all’amministrazione
        dopo altri 15 giorni.'
    NuovoSollecito:
      type: object
      required:
      - tipo
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSollecito'
        destinatario:
          type: string
          format: email
          description: Per il passaggio, l’indirizzo dell’amministrazione.
        inviato_il:
          type: string
          format: date-time
          description: Se assente, il momento della chiamata.
    Sollecito:
      type: object
      required:
      - id_sollecito
      - id_pagamento
      - tipo
      - inviato_il
      properties:
        id_sollecito:
          type: integer
          format: int64
        id_pagamento:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoSollecito'
        inviato_il:
          type: string
          format: date-time
        destinatario:
          type: string
          format: email
          nullable: true
        registrato_da:
          type: integer
          format: int64
          description: L’utente che ha registrato l’azione; vuoto se è automatica.
          nullable: true
    PuntoIngressi:
      type: object
      required:
      - codice_padiglione
      - inizio
      - ingressi_validi
      - ingressi_rifiutati
      properties:
        codice_padiglione:
          type: string
          enum:
          - P1
          - P2
          - P3
        inizio:
          type: string
          format: date-time
          description: Inizio dell’intervallo, in ora italiana.
        ingressi_validi:
          type: integer
          minimum: 0
        ingressi_rifiutati:
          type: integer
          minimum: 0
        presenti_stimati:
          type: integer
          minimum: 0
          nullable: true
          description: 'Stima: persone entrate nel padiglione negli ultimi permanenza_minuti minuti.'
    AndamentoIngressi:
      type: object
      required:
      - id_edizione
      - aggiornato_il
      - intervallo
      - serie
      properties:
        id_edizione:
          type: integer
          format: int32
        aggiornato_il:
          type: string
          format: date-time
        intervallo:
          type: string
          enum:
          - 1m
          - 5m
          - 15m
          - 1h
        serie:
          type: array
          items:
            $ref: '#/components/schemas/PuntoIngressi'
        non_riconosciuti:
          type: integer
          minimum: 0
          description: Letture con un codice che non esiste in biglietteria (35 per edizione nei dati storici, tutte
            rifiutate).
    LetturaVarco:
      type: object
      required:
      - codice_varco
      - codice_letto
      - momento
      - esito
      properties:
        id_lettura:
          type: string
          description: 'Identificativo della lettura nel sistema dei varchi, se disponibile. Facoltativo: evita
            i doppioni.'
          x-stato: da confermare
        codice_varco:
          type: string
          description: 'Uno dei 4 varchi: P1-Nord, P1-Sud, P2-Ovest, P3-Est.'
          example: P1-Nord
        codice_letto:
          type: string
          example: T26000001
        momento:
          type: string
          format: date-time
          description: 'Con fuso orario (per esempio …Z o …+01:00): nel 2025 i varchi registravano in UTC.'
          example: '2026-12-18T09:03:12+01:00'
        esito:
          type: string
          enum:
          - valido
          - rifiutato
          description: 'Nei file storici: 1 o 0 (2024), OK o KO (2025).'
    InvioLetture:
      type: object
      required:
      - letture
      properties:
        letture:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/LetturaVarco'
    RisultatoInvioLetture:
      type: object
      required:
      - accettate
      properties:
        accettate:
          type: integer
          minimum: 0
        scartate:
          type: array
          items:
            type: object
            properties:
              indice:
                type: integer
                minimum: 0
              motivo:
                type: string
    RiepilogoEspositore:
      type: object
      required:
      - id_espositore
      - id_edizione
      - scanner_usato
      - contatti
      properties:
        id_espositore:
          type: string
        id_edizione:
          type: integer
          format: int32
        codice_stand:
          type: string
          nullable: true
        scanner_usato:
          type: boolean
          description: 'Falso se lo stand non ha usato l’app: le visite sono allora vuote, non zero (26 stand su
            110 nel 2025).'
        visite_totali:
          type: integer
          minimum: 0
          nullable: true
        contatti:
          type: integer
          minimum: 0
          description: Contatti che hanno dato il consenso all’espositore.
        visite_edizione_precedente:
          type: integer
          minimum: 0
          description: Vuoto se l’edizione precedente non ha dati di visite (solo il 2025 li ha).
          nullable: true
    VisitaOra:
      type: object
      required:
      - codice_stand
      - data
      - scansioni
      properties:
        codice_stand:
          type: string
        data:
          type: string
          format: date
        ora:
          type: string
          pattern: ^([01][0-9]|2[0-3]):00$
          description: Fascia oraria, da 09:00 a 18:00. Vuoto se raggruppa=giorno.
          example: 09:00
          nullable: true
        scansioni:
          type: integer
          minimum: 0
    MediaPadiglione:
      type: object
      required:
      - data
      - stand_nel_campione
      properties:
        data:
          type: string
          format: date
        ora:
          type: string
          example: 09:00
          nullable: true
        media_scansioni:
          type: number
          description: Vuota se gli stand nel campione sono meno di cinque.
          nullable: true
        stand_nel_campione:
          type: integer
          minimum: 0
    VisiteEspositore:
      type: object
      required:
      - id_edizione
      - scanner_usato
      - visite
      properties:
        id_edizione:
          type: integer
          format: int32
        scanner_usato:
          type: boolean
        visite:
          type: array
          items:
            $ref: '#/components/schemas/VisitaOra'
        media_padiglione:
          type: array
          items:
            $ref: '#/components/schemas/MediaPadiglione'
    Contatto:
      type: object
      required:
      - id_contatto
      - id_edizione
      - codice_stand
      - momento
      - email
      properties:
        id_contatto:
          type: string
          example: L2500001
        id_edizione:
          type: integer
          format: int32
        codice_stand:
          type: string
        momento:
          type: string
          format: date-time
        email:
          type: string
          format: email
          description: Dato personale.
        fascia_eta:
          type: string
          enum:
          - 18-24
          - 25-34
          - 35-44
          - 45+
          nullable: true
        provincia:
          type: string
          pattern: ^[A-Z]{2}$
          nullable: true
        interesse:
          type: string
          enum:
          - beta test
          - newsletter
          - evento
          - prodotto
          - lavoro/stage
          nullable: true
    ScansioneInput:
      type: object
      required:
      - id_client
      - codice_stand
      - codice_letto
      properties:
        id_client:
          type: string
          format: uuid
          description: Generato dall’app a ogni scansione. Rende sicuro ripetere l’invio.
        codice_stand:
          type: string
          pattern: ^P[1-3]-[A-Z][0-9]{2}$
        codice_letto:
          type: string
          example: T26000001
        momento:
          type: string
          format: date-time
          description: Momento della scansione sul telefono, anche se l’invio avviene dopo.
    InvioScansioni:
      type: object
      required:
      - scansioni
      properties:
        scansioni:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ScansioneInput'
    EsitoScansione:
      type: object
      required:
      - id_client
      - stato
      properties:
        id_client:
          type: string
          format: uuid
        stato:
          type: string
          enum:
          - registrata
          - duplicata
          - scartata
          description: «Duplicata» se l’id_client era già stato ricevuto.
        riconosciuta:
          type: boolean
          description: Falso se il codice non esiste in biglietteria.
        conteggiata:
          type: boolean
          description: Falso se è una seconda scansione dello stesso biglietto allo stesso stand entro la finestra
            di tempo.
        proponi_contatto:
          type: boolean
          description: 'Falso per un biglietto ridotto o un gratuito per bambini: l’app non propone il contatto.'
        motivo:
          type: string
    RisultatoScansioni:
      type: object
      required:
      - esiti
      properties:
        esiti:
          type: array
          items:
            $ref: '#/components/schemas/EsitoScansione'
    ContattoInput:
      type: object
      required:
      - id_client
      - codice_stand
      - email
      - consenso_marketing
      - maggiorenne_dichiarato
      - id_informativa
      properties:
        id_client:
          type: string
          format: uuid
          description: 'Generato dall’app: ripetere l’invio non crea un secondo contatto.'
        codice_stand:
          type: string
          pattern: ^P[1-3]-[A-Z][0-9]{2}$
        email:
          type: string
          format: email
        fascia_eta:
          type: string
          enum:
          - 0-7
          - 8-13
          - 14-17
          - 18-24
          - 25-34
          - 35-44
          - 45+
          description: Le fasce minorili sono scartate con MINORE_NON_AMMESSO.
        provincia:
          type: string
          pattern: ^[A-Z]{2}$
        interesse:
          type: string
          enum:
          - beta test
          - newsletter
          - evento
          - prodotto
          - lavoro/stage
        momento:
          type: string
          format: date-time
          description: Momento della raccolta sul telefono.
        consenso_marketing:
          type: boolean
          enum:
          - true
          description: Consenso per quell’espositore, non per tutta la fiera.
        maggiorenne_dichiarato:
          type: boolean
          enum:
          - true
          description: Dichiarazione del visitatore nell’app.
        id_informativa:
          type: integer
          description: L’informativa mostrata, da GET /informativa/corrente.
        id_client_scansione:
          type: string
          format: uuid
          description: La scansione da cui nasce il contatto, se esiste.
    InvioContatti:
      type: object
      required:
      - contatti
      properties:
        contatti:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ContattoInput'
    EsitoContatto:
      type: object
      required:
      - id_client
      - stato
      properties:
        id_client:
          type: string
          format: uuid
        stato:
          type: string
          enum:
          - registrato
          - in_verifica
          - duplicato
          - scartato
          description: '«In_verifica»: contatto registrato ma non ancora visibile all’espositore.'
        id_contatto:
          type: string
          nullable: true
        motivo:
          type: string
          description: Per esempio MINORE_NON_AMMESSO.
    RisultatoContatti:
      type: object
      required:
      - esiti
      properties:
        esiti:
          type: array
          items:
            $ref: '#/components/schemas/EsitoContatto'
    EsclusioniContatto:
      type: object
      required:
      - id_edizione
      - aggiornato_il
      - codici
      properties:
        id_edizione:
          type: integer
          format: int32
        aggiornato_il:
          type: string
          format: date-time
        codici:
          type: array
          items:
            type: string
            example: T26000001
        totale:
          type: integer
          minimum: 0
    Informativa:
      type: object
      required:
      - id_informativa
      - versione
      - testo
      - in_vigore_dal
      properties:
        id_informativa:
          type: integer
        versione:
          type: string
        testo:
          type: string
        in_vigore_dal:
          type: string
          format: date
    Anomalia:
      type: object
      required:
      - id_anomalia
      - tabella
      - chiave_record
      - tipo
      - stato
      - rilevata_il
      properties:
        id_anomalia:
          type: integer
          format: int64
        tabella:
          type: string
          example: contratto
        chiave_record:
          type: string
          example: C2024-0078
        tipo:
          type: string
          example: saldo prima dell’acconto
        descrizione:
          type: string
          nullable: true
        trattamento:
          type: string
          nullable: true
        stato:
          type: string
          enum:
          - aperta
          - gestita
          - da_confermare
        rilevata_il:
          type: string
          format: date-time
