openapi: 3.0.3
info:
  title: ARCADE Milano – API della piattaforma
  version: 0.4.0-bozza
  description: |-
    Bozza preparata dal team BAD per il SAL 1 (data da definire), **da validare con il BID**, che realizza l’API. Include le risposte del cliente del 22 ottobre 2026 e segue lo schema dati (stessi nomi di tabelle e campi, in minuscolo con trattini bassi).

    **Convenzioni.** Percorsi sotto `/v1`. Identificativi di testo come nei dati (ESP001, C2024-0001, P1-A01); numeri generati per le entità nuove. Date `YYYY-MM-DD`. Orari in formato ISO 8601 con fuso orario, restituiti in ora italiana (Europe/Rome). Importi in euro. Sconti e aliquote come frazione tra 0 e 1. Elenchi con `pagina` e `per_pagina` (massimo 200). Errori con corpo `{codice, messaggio, dettagli}`.

    **Ruoli.** direzione, commerciale, direttore_commerciale, amministrazione, staff, espositore, amministratore, più la credenziale di servizio dei varchi. Il direttore commerciale è un ruolo a parte. Direzione e staff vedono solo numeri complessivi. Il commerciale vede espositori e contratti, e lo stato dei pagamenti ma senza modificarlo; l’amministrazione vede contratti e pagamenti e registra sempre gli incassi. I contatti dei visitatori li vede solo l’espositore a cui sono stati lasciati, più l’amministratore per le cancellazioni.

    **Sicurezza e privacy.** Ogni espositore vede solo i propri dati: lo verifica il server a partire dal token, non solo l’interfaccia. Dei minori non si conserva nessun dato riconoscibile: compaiono solo nei numeri complessivi e non si accettano contatti da minorenni. Il consenso si raccoglie solo allo stand, per quell’espositore, con prova di quando e con quale informativa. I contatti si cancellano dopo due anni dalla fiera.

    **Importi.** Gli importi sono imponibili. L’IVA si mostra a parte su preventivi e contratti (`aliquota_iva`, `iva_eur`, `totale_eur`). Fatturazione e regole fiscali non sono comprese.

    **Cosa è ancora aperto.** Le operazioni con `x-stato` «da confermare», «parziale» o «proposta» dipendono da risposte del cliente. `x-domande` indica il numero della domanda nella sezione 11.B dell’analisi funzionale. Per reggere il congelamento, i campi che dipendono da queste risposte sono facoltativi: le aggiunte future non rompono il contratto. Non sono comprese: fatturazione e regole fiscali, pagamenti online, vendita online dei biglietti, app per i visitatori, lista d’attesa.
servers:
- url: https://api.example.org/v1
  description: 'Indirizzo segnaposto: da definire con il BID.'
tags:
- name: Gestione commerciale
  description: Edizioni, padiglioni, stand, listino, preventivi, contratti, pagamenti, solleciti, rinnovi e anomalie
    dei dati.
- name: Cruscotto staff
  description: 'Cruscotto dello staff: ingressi per padiglione.'
- name: Pagina espositore
  description: 'Pagina dell’espositore: solo i propri dati, e cancellazione dei contatti su richiesta.'
- name: Scansione allo stand
  description: App di scansione allo stand, per il personale degli espositori.
- name: Dati dai varchi
  description: Ricezione delle letture dai tornelli.
security:
- bearerAuth: []
paths:
  /edizioni:
    get:
      tags:
      - Gestione commerciale
      operationId: elencaEdizioni
      summary: Elenca le edizioni
      x-ruoli:
      - commerciale
      - direttore_commerciale
      - amministrazione
      - direzione
      - staff
      - espositore
      - amministratore
      responses:
        '200':
          description: Elenco delle edizioni (2024, 2025, 2026).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Edizione'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
  /edizioni/{id_edizione}:
    get:
      tags:
      - Gestione commerciale
      operationId: leggiEdizione
      summary: Legge un’edizione
      x-ruoli:
      - commerciale
      - direttore_commerciale
      - amministrazione
      - direzione
      - staff
      - espositore
      - amministratore
      parameters:
      - $ref: '#/components/parameters/IdEdizione'
      responses:
        '200':
          description: L’edizione, con le scadenze calcolate dalla data di apertura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edizione'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
  /padiglioni:
    get:
      tags:
      - Gestione commerciale
      operationId: elencaPadiglioni
      summary: Elenca i padiglioni
      x-ruoli:
      - commerciale
      - direttore_commerciale
      - amministrazione
      - direzione
      - staff
      - espositore
      - amministratore
      responses:
        '200':
          description: I tre padiglioni P1, P2 e P3.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Padiglione'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
  /edizioni/{id_edizione}/stand:
    get:
      tags:
      - Gestione commerciale
      operationId: elencaStand
      summary: Elenca gli stand di un’edizione con il loro stato
      description: 'Lo stato non è salvato: è calcolato, con questa priorità. «venduto» se esiste un contratto attivo
        per lo stand nell’edizione. «opzionato» se esiste un preventivo «in_approvazione» o «inviato» non scaduto
        (la bozza non blocca lo stand). «in_prelazione» se la prelazione non è scaduta (31 marzo) e lo stand era
        venduto nell’edizione precedente: può essere opzionato solo dall’espositore che lo aveva. Altrimenti «libero».
        Gli stand sono 130 (45 in P1, 40 in P2, 45 in P3). Nel 2026 la prelazione è già scaduta (31 marzo).'
      x-ruoli:
      - commerciale
      - direttore_commerciale
      - amministrazione
      - direzione
      parameters:
      - $ref: '#/components/parameters/IdEdizione'
      - name: stato
        in: query
        schema:
          $ref: '#/components/schemas/StatoStand'
      - name: codice_padiglione
        in: query
        schema:
          type: string
          enum:
          - P1
          - P2
          - P3
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/PerPagina'
      responses:
        '200':
          description: Gli stand dell’edizione, con lo stato calcolato.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    dati:
                      type: array
                      items:
                        $ref: '#/components/schemas/Stand'
                  required:
                  - dati
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
  /edizioni/{id_edizione}/listino:
    get:
      tags:
      - Gestione commerciale
      operationId: leggiListino
      summary: Legge il listino di un’edizione
      description: 'Per il 2024 e il 2025 non esistono file di listino: i prezzi si ricavano dalle righe dei contratti.
        Il listino completo esiste solo per il 2026.'
      x-ruoli:
      - commerciale
      - direttore_commerciale
      - amministrazione
      - direzione
      parameters:
      - $ref: '#/components/parameters/IdEdizione'
      - name: tipo_voce
        in: query
        schema:
          $ref: '#/components/schemas/TipoVoce'
      responses:
        '200':
          description: Le voci del listino.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VoceListino'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
  /edizioni/{id_edizione}/rinnovi:
    get:
      tags:
      - Gestione commerciale
      operationId: elencaRinnovi
      summary: Elenca gli espositori dell’edizione precedente e il loro stato di rinnovo
      description: Serve a individuare chi ha partecipato e chi non è tornato, e a proporre il rinnovo. Un rinnovo
        è la presenza all’edizione precedente, anche su uno stand diverso (confermato dal cliente).
      x-ruoli:
      - commerciale
      - direttore_commerciale
      x-stato: proposta
      parameters:
      - $ref: '#/components/parameters/IdEdizione'
      - name: stato
        in: query
        schema:
          $ref: '#/components/schemas/StatoRinnovo'
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/PerPagina'
      responses:
        '200':
          description: Gli espositori dell’edizione precedente con lo stato di rinnovo.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    dati:
                      type: array
                      items:
                        $ref: '#/components/schemas/Rinnovo'
                  required:
                  - dati
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
  /espositori:
    get:
      tags:
      - Gestione commerciale
      operationId: elencaEspositori
      summary: Elenca gli espositori
      description: 'I campi referente ed email_referente sono dati personali: li vedono solo commerciale e amministrazione.'
      x-ruoli:
      - commerciale
      - direttore_commerciale
      - amministrazione
      parameters:
      - name: q
        in: query
        description: Ricerca nella ragione sociale.
        schema:
          type: string
          minLength: 2
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/PerPagina'
      responses:
        '200':
          description: Gli espositori.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    dati:
                      type: array
                      items:
                        $ref: '#/components/schemas/Espositore'
                  required:
                  - dati
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
    post:
      tags:
      - Gestione commerciale
      operationId: creaEspositore
      summary: Crea un espositore
      description: Risponde 409 se la partita IVA esiste già (nei 135 espositori attuali non ci sono duplicati).
      x-ruoli:
      - commerciale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuovoEspositore'
      responses:
        '201':
          description: Espositore creato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Espositore'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '409':
          $ref: '#/components/responses/Conflitto'
  /espositori/{id_espositore}:
    get:
      tags:
      - Gestione commerciale
      operationId: leggiEspositore
      summary: Legge un espositore
      description: Un utente con ruolo espositore può leggere solo il proprio.
      x-ruoli:
      - commerciale
      - direttore_commerciale
      - amministrazione
      - espositore
      parameters:
      - $ref: '#/components/parameters/IdEspositore'
      responses:
        '200':
          description: L’espositore.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Espositore'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
  /preventivi:
    get:
      tags:
      - Gestione commerciale
      operationId: elencaPreventivi
      summary: Elenca i preventivi
      x-ruoli:
      - commerciale
      - direttore_commerciale
      parameters:
      - name: id_edizione
        in: query
        schema:
          type: integer
          format: int32
      - name: id_espositore
        in: query
        schema:
          type: string
      - name: stato
        in: query
        schema:
          $ref: '#/components/schemas/StatoPreventivo'
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/PerPagina'
      responses:
        '200':
          description: I preventivi.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
                - type: object
                  properties:
                    dati:
                      type: array
                      items:
                        $ref: '#/components/schemas/Preventivo'
                  required:
                  - dati
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
    post:
      tags:
      - Gestione commerciale
      operationId: creaPreventivo
      summary: Crea un preventivo in bozza
      description: 'Lo stand deve essere libero, oppure in prelazione se l’espositore è quello che lo aveva nell’edizione
        precedente: altrimenti 409 STAND_NON_DISPONIBILE o STAND_IN_PRELAZIONE. La bozza non blocca lo stand. Il
        campo in_prelazione e lo sconto fedeltà del 5% li calcola il server, non si inseriscono. Dopo la chiusura
        delle vendite (15 giorni prima dell’apertura, per il 2026 il 3 dicembre) risponde 422 VENDITE_CHIUSE. Il
        server aggiunge da solo la riga di area (SPAZIO) e la maggiorazione (angolo 10%, penisola 15%, isola 25%);
        nel corpo si indicano solo extra e sponsorizzazioni. Le sponsorizzazioni valgono solo insieme a uno stand;
        se sono esaurite si risponde 409 SPONSORIZZAZIONE_ESAURITA, se la voce è riservata a un altro padiglione
        422 SPONSORIZZAZIONE_RISERVATA. Uno sconto oltre 0,20 dà 422 SCONTO_OLTRE_SOGLIA. Il preventivo vale 30
        giorni dall’invio. L’IVA è mostrata a parte (aliquota 22% salvo diversa decisione dell’amministrazione).'
      x-ruoli:
      - commerciale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuovoPreventivo'
      responses:
        '201':
          description: Preventivo creato in stato «bozza».
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preventivo'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
        '409':
          $ref: '#/components/responses/Conflitto'
        '422':
          $ref: '#/components/responses/NonElaborabile'
  /preventivi/{id_preventivo}:
    get:
      tags:
      - Gestione commerciale
      operationId: leggiPreventivo
      summary: Legge un preventivo con le sue righe
      x-ruoli:
      - commerciale
      - direttore_commerciale
      parameters:
      - $ref: '#/components/parameters/IdPreventivo'
      responses:
        '200':
          description: Il preventivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preventivo'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
  /preventivi/{id_preventivo}/invio:
    post:
      tags:
      - Gestione commerciale
      operationId: richiediInvioPreventivo
      summary: Invia il preventivo, o lo manda in approvazione
      description: 'Fino al 10% di sconto il preventivo passa da «bozza» a «inviato», con data di invio. Oltre il
        10% passa a «in_approvazione» e attende il direttore commerciale. L’e-mail all’espositore la invia la piattaforma
        con il flusso «Invia preventivo» (confermato dal cliente): l’API registra l’invio e il flusso la chiama.
        Quando il preventivo va in approvazione si registra in_approvazione_dal.'
      x-ruoli:
      - commerciale
      parameters:
      - $ref: '#/components/parameters/IdPreventivo'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvioPreventivo'
      responses:
        '200':
          description: Preventivo inviato. Lo stand risulta opzionato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preventivo'
        '202':
          description: 'Lo sconto supera il 10%: il preventivo è «in_approvazione» e non è stato inviato.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preventivo'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
        '409':
          $ref: '#/components/responses/Conflitto'
  /preventivi/{id_preventivo}/approvazione:
    post:
      tags:
      - Gestione commerciale
      operationId: decidiApprovazionePreventivo
      summary: Approva o respinge uno sconto oltre il 10%
      description: 'Per gli sconti dal 10% al 20% decide il direttore commerciale. Se approva, il preventivo viene
        inviato (stato «inviato», con approvato_da e approvato_il). Se respinge torna in bozza (confermato dal cliente).
        Un preventivo in approvazione blocca lo stand ma non scade da solo: dopo 3 giorni la piattaforma avvisa
        il direttore commerciale e dopo 7 giorni senza decisione il preventivo torna in bozza e lo stand si libera
        (regola proposta, punto aperto 1). Oltre il 20% non è possibile.'
      x-ruoli:
      - direttore_commerciale
      x-stato: proposta
      x-domande:
      - 1
      parameters:
      - $ref: '#/components/parameters/IdPreventivo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisioneApprovazione'
      responses:
        '200':
          description: 'Preventivo aggiornato: «inviato» se approvato, «bozza» se respinto.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preventivo'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
        '409':
          $ref: '#/components/responses/Conflitto'
  /preventivi/{id_preventivo}/perdita:
    post:
      tags:
      - Gestione commerciale
      operationId: segnaPreventivoPerso
      summary: Segna il preventivo come perso
      description: 'Vale quando l’espositore non accetta. Un preventivo scaduto passa a «scaduto» da solo, alla
        fine dei 30 giorni. Un preventivo «accettato» non si può perdere: si usa la disdetta del contratto.'
      x-ruoli:
      - commerciale
      - direttore_commerciale
      parameters:
      - $ref: '#/components/parameters/IdPreventivo'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Preventivo in stato «perso». Lo stand torna libero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preventivo'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
        '409':
          $ref: '#/components/responses/Conflitto'
  /preventivi/{id_preventivo}/contratto:
    post:
      tags:
      - Gestione commerciale
      operationId: trasformaInContratto
      summary: Trasforma il preventivo accettato in contratto
      description: 'In un’unica operazione: il preventivo passa ad «accettato», nasce il contratto con le righe
        copiate dal preventivo e l’aliquota IVA, e si creano i due pagamenti. Acconto: 30% dell’imponibile, scadenza
        15 giorni dopo la firma. Saldo: 70% dell’imponibile, scadenza 30 giorni prima dell’apertura (18 novembre
        2026). Se la scadenza dell’acconto cadrebbe dopo quella del saldo, acconto e saldo scadono entrambi 15 giorni
        prima dell’apertura (3 dicembre 2026). Dopo la chiusura delle vendite risponde 422 VENDITE_CHIUSE.'
      x-ruoli:
      - commerciale
      parameters:
      - $ref: '#/components/parameters/IdPreventivo'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmaContratto'
      responses:
        '201':
          description: Contratto creato, con le sue righe e i due pagamenti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contratto'
        '400':
          $ref: '#/components/responses/RichiestaNonValida'
        '401':
          $ref: '#/components/responses/NonAutenticato'
        '403':
          $ref: '#/components/responses/NonAutorizzato'
        '404':
          $ref: '#/components/responses/NonTrovato'
        '409':
          $ref: '#/components/responses/Conflitto'
        '422':
          $ref: '#/components/responses/NonElaborabile'
  /contratti:
    get:
      tags:
      - Gestione commerciale
      operationId: elencaContratti
      summary: Elenca i contratti
      x-ruoli:
      - commerciale
      - direttore_commerciale
      - amministrazione
      parameters:
      - name: id_edizione
        in: query
        schema:
          type: integer
          format: int32
      - name: id_espositore
        in: query
        schema:
          type: string
      - name: stato
        in: query
        schema:
          type: string
          enum:
          - attivo
          - disdetto
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/PerPagina'
      responses:
        '200':
          description: I contratti.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagina'
