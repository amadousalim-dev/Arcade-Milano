scrHome As screen:
    CopilotContext: |-
        ={ ScreenName: Self.Name }
    CopilotPromptSuggestions: =[]
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary

    Label1 As label:
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        Size: =13
        Text: |-
            ="Stand: " & CountRows('arcade.stand') 
        X: =40
        Y: =40
        ZIndex: =1

    Label1_1 As label:
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        Size: =13
        Text: |-
            ="Espositori: " & CountRows('arcade.espositore') 
        X: =40
        Y: =100
        ZIndex: =2

    Label1_2 As label:
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        Size: =13
        Text: |-
            ="Contratti 2025: " &
                CountRows(Filter('arcade.contratto', id_edizione = 2025))
        Width: =170
        X: =40
        Y: =160
        ZIndex: =3

    Label1_3 As label:
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        Height: =42
        Size: =13
        Text: |-
            ="Apertura 2026: " & Text(LookUp('arcade.edizione', id_edizione = 2026).data_inizio, "dd/mm/yyyy")
        Width: =267
        X: =40
        Y: =217
        ZIndex: =4

