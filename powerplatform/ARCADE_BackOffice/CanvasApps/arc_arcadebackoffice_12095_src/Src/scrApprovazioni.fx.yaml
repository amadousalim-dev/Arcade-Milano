        PaddingTop: =8
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Visible: =!gblPuo.approvare
        Width: =Parent.Width
        ZIndex: =2

        lblAccessoApprNegato As label:
            Align: =Align.Center
