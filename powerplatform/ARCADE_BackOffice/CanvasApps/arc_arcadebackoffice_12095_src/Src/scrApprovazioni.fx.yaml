                LayoutMode: =LayoutMode.Auto
                PaddingBottom: =8
                PaddingLeft: =8
                PaddingRight: =8
                PaddingTop: =8
                RadiusBottomLeft: =nfRaggio
                RadiusBottomRight: =nfRaggio
                RadiusTopLeft: =nfRaggio
                RadiusTopRight: =nfRaggio
                ZIndex: =2

                "galAppRighe As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    '#CopilotOverlayLabel': ="Filtro applicato"
