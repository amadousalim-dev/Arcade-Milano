                    Layout: =Layout.Vertical
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    LoadingSpinner: =LoadingSpinner.Data
                    TemplatePadding: =0
