scrContratti As screen:
    ContentLanguage: =""
    CopilotContext: |-
        ={ ScreenName: Self.Name }
    CopilotPromptSuggestions: =[]
    Fill: =nfColoreSfondo
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =Refresh('arcade.contratto'); Refresh('arcade.pagamento');
        // tutti i pagamenti (circa 400): una sola richiesta semplice
        ClearCollect(colPagamenti, 'arcade.pagamento');
        Select(btnCaricaContratti)

    ScreenContainer1_1 As groupContainer.horizontalAutoLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =nfColoreSfondo
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =16
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =16
        PaddingLeft: =16
        PaddingRight: =16
        PaddingTop: =16
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        ZIndex: =1

        HeaderContainer1_1 As groupContainer.horizontalAutoLayoutContainer:
            DropShadow: =DropShadow.Light
            Fill: =nfColoreSuperficie
            FillPortions: =0
            Height: =75
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =16
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =nfRaggio
            RadiusBottomRight: =nfRaggio
            RadiusTopLeft: =nfRaggio
            RadiusTopRight: =nfRaggio
            ZIndex: =1

            btnIndietroCont As icon:
                AccessibleLabel: ="Torna alla home"
                BorderColor: =App.Theme.Colors.Darker40
                Color: =nfColoreTesto
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(244, 244, 244, 1)
                Height: =61
                Icon: =Icon.BackArrow
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                OnSelect: =Navigate(scrHome)
                TabIndex: =1
                Width: =53
                X: =34
                Y: =3
                ZIndex: =1

            lblTitoloContratti As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =nfColoreTesto
                DisabledColor: =RGBA(166, 166, 166, 1)
                FillPortions: =1
                Font: =App.Theme.Font
                FontWeight: =FontWeight.Bold
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                Role: =TextRole.Heading1
                Size: =nfDimTitolo
                Text: ="Contratti"
                ZIndex: =2

            drpEdizioneContr As modernDropdown:
                AccessibleLabel: ="1"
                Appearance: =Appearance.FilledDarker
                BorderStyle: =""
                Default: =LookUp(colEdizioni, id_edizione = EdizioneSel.id_edizione)
                Font: =""
                ItemDisplayText: =ThisItem.nome
                Items: =colEdizioni
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                OnChange: =Select(btnCaricaContratti)
                Required: =false
                Size: =21
                ValidationState: =ValidationState.None
                Width: =280
                X: =719
                Y: =33
                ZIndex: =5

            drpFiltroPag As modernDropdown:
                AccessibleLabel: ="1"
                Appearance: =Appearance.FilledDarker
                BorderStyle: =""
                Default: |-
                    ={Value: "Tutti"}
                Font: =""
                ItemDisplayText: =ThisItem.Value
                Items: =["Tutti", "Con crediti aperti", "Da pagare", "Pagati in ritardo", "Non consegnabili", "Disdetti"]
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                OnChange: =
                Required: =false
                Size: =21
                ValidationState: =ValidationState.None
                Width: =280
                X: =719
                Y: =33
                ZIndex: =6

        OverviewContainer As groupContainer.horizontalAutoLayoutContainer:
            DropShadow: =DropShadow.Light
            Fill: =nfColoreSuperficie
            FillPortions: =0
            Height: =75
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =16
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =nfRaggio
            RadiusBottomRight: =nfRaggio
            RadiusTopLeft: =nfRaggio
            RadiusTopRight: =nfRaggio
            ZIndex: =2

            txtCercaContr As modernTextInput:
                Appearance: =Appearance.FilledDarker
                BorderStyle: =""
                FillPortions: =2
                Font: =""
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                Placeholder: ="Cerca contratto..."
                Required: =false
                TriggerOutput: =TriggerOutput.Keypress
                ValidationState: =ValidationState.None
                ZIndex: =1

            lblContrNumero As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =nfColoreTesto
                DisabledColor: =RGBA(166, 166, 166, 1)
                FillPortions: =1
                Font: =App.Theme.Font
                FontWeight: =FontWeight.Bold
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                Role: =TextRole.Heading1
                Size: =nfDimTitoloRiquadro
                Text: =CountRows(colContratti) & " contratti"
                ZIndex: =2

            lblContrCrediti As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =If(Sum(colContratti, credito_aperto) > 0, nfColoreErrore, nfColoreOk)
                DisabledColor: =RGBA(166, 166, 166, 1)
                FillPortions: =3
                Font: =App.Theme.Font
                FontWeight: =FontWeight.Bold
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                Role: =TextRole.Heading1
                Size: =nfDimTitoloRiquadro
                Text: |-
                    ="Crediti aperti: " & Text(Sum(colContratti, credito_aperto), "[$-en-US]#,##0.00", "it-IT") &
                      " € su " & CountRows(Filter(colContratti, credito_aperto > 0)) & " contratti"
                ZIndex: =3

        MainContainer1_1 As groupContainer.horizontalAutoLayoutContainer:
            BorderColor: =nfAccentoContratti
            BorderThickness: =nfSpessoreBordo
            DropShadow: =DropShadow.Light
            Fill: =nfColoreSuperficie
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =nfRaggio
            RadiusBottomRight: =nfRaggio
            RadiusTopLeft: =nfRaggio
            RadiusTopRight: =nfRaggio
            ZIndex: =3

            "galContratti As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                '#CopilotOverlayLabel': ="Filtro applicato"
                AccessibleLabel: ="1"
                BorderColor: =App.Theme.Colors.Darker40
                DelayItemLoading: =true
                Fill: =nfColoreSuperficie
                Items: |-
                    =SortByColumns(
                      Filter(colContratti,
                        Switch(drpFiltroPag.Selected.Value,
                          "Con crediti aperti", credito_aperto > 0,
                          "Da pagare",          da_pagare > 0,
                          "Pagati in ritardo",  in_ritardo,
                          "Non consegnabili",   stato = "attivo" && !consegnabile,
                          "Disdetti",           stato = "disdetto",
                          true) &&
                        (IsBlank(txtCercaContr.Text) || StartsWith(codice_stand, Upper(txtCercaContr.Text)) ||
                         StartsWith(id_contratto, Upper(txtCercaContr.Text)))),
                      "id_contratto", SortOrder.Ascending)
                Layout: =Layout.Vertical
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LoadingSpinner: =LoadingSpinner.Data
                OnSelect: |-
                    =Set(gblIdContratto, ThisItem.id_contratto);
                    Navigate(scrContratto)
                TabIndex: =1
                TemplatePadding: =0
                TemplateSize: =150
                ZIndex: =6

                Rectangle4_1 As rectangle:
                    BorderColor: =App.Theme.Colors.Darker40
                    Fill: =nfAccentoContratti
                    Height: =Parent.TemplateHeight - Separator5_1.Height
                    OnSelect: =Select(Parent)
                    Visible: =ThisItem.IsSelected
                    Width: =4
                    ZIndex: =1

                lblCtrTitolo As label:
                    AutoHeight: =true
                    Color: =nfColoreTesto
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Font: =App.Theme.Font
                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Self.Size * 1.8
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =nfDimTesto
                    Text: |-
                        =ThisItem.id_contratto & " – stand " & ThisItem.codice_stand &
                                            If(ThisItem.stato = "disdetto", "  (DISDETTO)", "")
                    VerticalAlign: =VerticalAlign.Top
                    Width: =Parent.TemplateWidth - 173
                    X: =57
                    Y: =6
                    ZIndex: =2

                lblCtrEsp As label:
                    AutoHeight: =true
                    Color: =nfColoreTesto
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Font: =App.Theme.Font
                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Self.Size * 1.8
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =12
                    Text: =LookUp(colEspositori, id_espositore = ThisItem.id_espositore).ragione_sociale
                    VerticalAlign: =VerticalAlign.Top
                    Width: =1056
                    X: =57
                    Y: =47
                    ZIndex: =3

                NextArrow5_1 As icon:
                    AccessibleLabel: =Self.Tooltip
                    Color: =nfColoreTestoSecondario
                    Height: =50
                    Icon: =Icon.ChevronRight
                    OnSelect: =Select(Parent)
                    PaddingBottom: =16
                    PaddingLeft: =16
                    PaddingRight: =16
                    PaddingTop: =16
                    Tooltip: ="Visualizza dettagli elementi"
                    Width: =50
                    X: =Parent.TemplateWidth - Self.Width - 12
                    Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                    ZIndex: =4

                lblCtrImporti As label:
                    AutoHeight: =true
                    Color: =If(ThisItem.credito_aperto > 0, nfColoreErrore, nfColoreTesto)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Font: =App.Theme.Font
                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                    Height: =Self.Size * 1.8
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =12
                    Text: |-
                        ="Imponibile " & Text(ThisItem.imponibile_eur, "[$-en-US]#,##0.00", "it-IT") & " €" &
                          If(ThisItem.credito_aperto > 0,
                             "  ·  Credito aperto " & Text(ThisItem.credito_aperto, "[$-en-US]#,##0.00", "it-IT") & " €", "")
                    VerticalAlign: =VerticalAlign.Top
                    Width: =lblCtrTitolo.Width
                    X: =57
                    Y: =87
                    ZIndex: =5

                Separator5_1 As rectangle:
                    BorderColor: =App.Theme.Colors.Darker40
                    Fill: =nfColoreSfondo
                    Height: =8
                    OnSelect: =Select(Parent)
                    Width: =Parent.TemplateWidth
                    Y: =Parent.TemplateHeight - Self.Height
                    ZIndex: =6

    btnCaricaContratti As modernButton:
        BorderStyle: =""
        Font: =""
        OnSelect: |-
            =ClearCollect(colContratti,
              ForAll(Filter('arcade.contratto', id_edizione = drpEdizioneContr.Selected.id_edizione) As c,
                With({ pag: Filter(colPagamenti, id_contratto = c.id_contratto) },
                  { id_contratto: c.id_contratto,
                    id_espositore: c.id_espositore,
                    codice_stand: c.codice_stand,
                    imponibile_eur: c.imponibile_eur,
                    stato: c.stato,
                    deroga_allestimento_il: c.deroga_allestimento_il,
                    // credito aperto: scaduto, non pagato, non annullato
                    credito_aperto: Sum(Filter(pag, IsBlank(pagato_il) && !annullato && scadenza < Today()), importo),
                    da_pagare: Sum(Filter(pag, IsBlank(pagato_il) && !annullato && scadenza >= Today()), importo),
                    consegnabile: c.stato = "attivo" &&
                      (!IsBlank(LookUp(pag, tipo = "saldo").pagato_il) || !IsBlank(c.deroga_allestimento_il)),
                    saldo_pagato: !IsBlank(LookUp(pag, tipo = "saldo").pagato_il),
                    in_ritardo: CountRows(Filter(pag, !IsBlank(pagato_il) && pagato_il > scadenza)) > 0 })))
        Size: =0
        Text: ="Pulsante"
        Visible: =false
        X: =420
        Y: =33
        ZIndex: =2

