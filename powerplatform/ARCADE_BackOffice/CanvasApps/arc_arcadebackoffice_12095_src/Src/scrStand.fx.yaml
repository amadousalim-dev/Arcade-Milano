                           Navigate(scrPreventivo)
            Text: ="Nuovo Preventivo"
            ZIndex: =6

        btnNuovoPreventivo_1 As modernButton:
            AccessibleLabel: ="1"
            BorderStyle: =""
            Font: =""
            Height: =40
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: |-
                =If(!IsBlank(galStand.Selected.id_contratto),
                     // stand venduto: si apre il contratto
                     Set(gblIdContratto, galStand.Selected.id_contratto);
                     Navigate(scrContratto),
                     // stand opzionato: si apre il preventivo che lo blocca
