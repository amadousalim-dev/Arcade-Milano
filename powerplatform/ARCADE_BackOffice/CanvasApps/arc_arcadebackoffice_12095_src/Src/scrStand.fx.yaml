        lblDetDati As label:
            AutoHeight: =true
            BorderColor: =App.Theme.Colors.Darker40
            Color: =RGBA(0, 0, 0, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            Size: =13
            Text: |-
                ="Padiglione: " & galStand.Selected.codice_padiglione & Char(10) &
                "Superficie: " & galStand.Selected.mq & " m²" & Char(10) &
                "Posizione: " & galStand.Selected.posizione & Char(10) &
                "Prezzo di listino: " &
                  If(IsBlank(galStand.Selected.prezzo_listino),
                     "non disponibile",
                     Text(galStand.Selected.prezzo_listino, "[$-en-US]#,##0.00", "it-IT") & " €") & If(!IsBlank(galStand.Selected.imponibile_contratto),
                     Char(10) & "Imponibile del contratto: " &
                     Text(galStand.Selected.imponibile_contratto, "[$-en-US]#,##0.00", "it-IT") & " €",
                     "")
            ZIndex: =3

        lblDetEspositore As label:
            AutoHeight: =true
            BorderColor: =App.Theme.Colors.Darker40
            Color: =RGBA(0, 0, 0, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            Size: =13
            Text: |-
                =If(IsBlank(galStand.Selected.id_espositore_rif),
                   "Nessun espositore collegato",
                   Switch(galStand.Selected.stato,
                     "venduto",       "Venduto a: ",
                     "opzionato",     "Opzionato da: ",
                     "in_prelazione", "Riservato a: ") &
                   LookUp(colEspositori, id_espositore = galStand.Selected.id_espositore_rif).ragione_sociale)
            ZIndex: =4

        lblDetRiferimento As label:
            AutoHeight: =true
            BorderColor: =App.Theme.Colors.Darker40
            Color: =RGBA(0, 0, 0, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
