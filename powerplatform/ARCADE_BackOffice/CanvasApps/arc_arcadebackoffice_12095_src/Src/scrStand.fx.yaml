            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: |-
                =Set(gblStand, galStand.Selected);
                           Set(gblIdPreventivo, Blank());   // nuovo preventivo
