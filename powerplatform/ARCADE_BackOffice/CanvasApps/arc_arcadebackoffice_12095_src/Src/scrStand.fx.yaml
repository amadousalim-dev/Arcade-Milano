scrStand As screen:
    CopilotContext: |-
        ={ ScreenName: Self.Name }
    CopilotPromptSuggestions: =[]
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =If(IsEmpty(colEdizioni),
           ClearCollect(colEdizioni, Sort('arcade.edizione', id_edizione, SortOrder.Descending)));
        Select(btnCalcolaStati)

    drpEdizione As modernDropdown:
        AccessibleLabel: ="1"
        Appearance: =Appearance.FilledDarker
        Default: =LookUp(colEdizioni, id_edizione = EdizioneSel.id_edizione)
        ItemDisplayText: =ThisItem.nome
        Items: =colEdizioni
        OnChange: =Select(btnCalcolaStati)
        ValidationState: =ValidationState.None
        Width: =280
        X: =64
        Y: =12
        ZIndex: =1

    btnCalcolaStati As modernButton:
        AccessibleLabel: ="1"
        OnSelect: |-
            =// edizione da usare: quella del menu, o il 2026 se il menu non è ancora pronto
            Set(gblEdVista, If(IsBlank(drpEdizione.Selected),
                               LookUp(colEdizioni, id_edizione = EdizioneSel.id_edizione),
                               drpEdizione.Selected));
            With({ ed: gblEdVista },
              Refresh('arcade.contratto'); Refresh('arcade.preventivo');
              // stand che esistono in quell'edizione (attivo_dal <= anno)
              ClearCollect(colStandEd, Filter('arcade.stand', attivo_dal <= ed.id_edizione));
              // contratti attivi dell'edizione: rendono lo stand "venduto"
              ClearCollect(colContrattiAttivi,
                Filter('arcade.contratto', id_edizione = ed.id_edizione && stato = "attivo"));
              // preventivi che bloccano lo stand (la bozza non blocca)
              ClearCollect(colPreventiviAperti,
                Filter('arcade.preventivo', id_edizione = ed.id_edizione &&
                  (stato = "in_approvazione" ||
                   (stato = "inviato" && valido_fino >= Today()))));
              // stand venduti l'anno prima: servono alla prelazione
              ClearCollect(colVendutiPrec,
                Filter('arcade.contratto', id_edizione = ed.id_edizione - 1 && stato = "attivo"));
              ClearCollect(colListino, Filter('arcade.listino', id_edizione = ed.id_edizione))
            );
            ClearCollect(colStatoStand,
              ForAll(colStandEd As s,
                With({
                  c:    LookUp(colContrattiAttivi,  codice_stand = s.codice_stand),
                  p:    LookUp(colPreventiviAperti, codice_stand = s.codice_stand),
                  prec: LookUp(colVendutiPrec,      codice_stand = s.codice_stand),
                  ed:   gblEdVista,
                  prezzoMq: LookUp(colListino, codice_voce = "SPAZIO-" & s.codice_padiglione).prezzo_unitario,
                  pctMagg:  Coalesce(LookUp(colListino,
                              codice_voce = "MAGG-" & Upper(s.posizione)).prezzo_unitario, 0)
                },
                {
                  codice_stand: s.codice_stand,
                  codice_padiglione: s.codice_padiglione,
                  mq: s.mq,
                  posizione: s.posizione,
                  stato: If(
                    !IsBlank(c), "venduto",
                    !IsBlank(p), "opzionato",
                    !IsBlank(prec) && !IsBlank(ed.scadenza_prelazione)
                      && Today() <= ed.scadenza_prelazione, "in_prelazione",
                    "libero"),
                  id_espositore_rif: Coalesce(c.id_espositore, p.id_espositore, prec.id_espositore),
                  id_contratto: c.id_contratto,
                  id_preventivo: p.id_preventivo,
                  prezzo_listino: If(IsBlank(prezzoMq), Blank(), Round(s.mq * prezzoMq * (1 + pctMagg), 2)),
                  imponibile_contratto: c.imponibile_eur
                })))
        Text: ="Pulsante"
        Visible: =false
        X: =152
        Y: =269
        ZIndex: =2

