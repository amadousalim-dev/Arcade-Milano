        btnNuovoPreventivo As modernButton:
            AccessibleLabel: ="1"
            DisplayMode: |-
                =If(
                  drpEdizione.Selected.id_edizione = EdizioneSel.id_edizione &&
                  Today() <= ChiusuraVendite &&
                  galStand.Selected.stato in ["libero", "in_prelazione"],
                  DisplayMode.Edit, DisplayMode.Disabled)
