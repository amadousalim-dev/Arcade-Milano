        Text: |-
            =With({ d: LookUp(colSponsorOccupati, codice_voce = cmbVoce.Selected.codice_voce).disponibili },
              If(d <= 0, "Esaurita", "Disponibili: " & d & " su " & cmbVoce.Selected.quantita_disponibile))
        Visible: =cmbVoce.Selected.tipo_voce = "sponsorizzazione"
        Width: =244
        X: =496
        Y: =476
        ZIndex: =11

