    btnCaricaImpegni As modernButton:
        BorderStyle: =""
        Font: =""
        OnSelect: |-
            =// contratti attivi dell'edizione e preventivi aperti (escluso quello corrente)
            ClearCollect(colContrattiVend,
              Filter('arcade.contratto', id_edizione = EdizioneSel.id_edizione && stato = "attivo"));
            // 1. al database solo il filtro semplice sull'edizione
            ClearCollect(colPrevAperti,
              Filter('arcade.preventivo', id_edizione = EdizioneSel.id_edizione));
            // 2. nell'app: tolgo quelli che non impegnano niente e quello che sto modificando
            RemoveIf(colPrevAperti,
              !(stato = "in_approvazione" || (stato = "inviato" && valido_fino >= Today())) ||
              id_preventivo = gblIdPreventivo);
            // quantità già occupate per ogni sponsorizzazione
            ClearCollect(colSponsorOccupati,
              ForAll(Filter(colListinoVend, tipo_voce = "sponsorizzazione") As v,
                { codice_voce: v.codice_voce,
                  disponibili: v.quantita_disponibile
                    - Sum(Filter('arcade.riga_contratto', codice_voce = v.codice_voce &&
                            id_contratto in colContrattiVend.id_contratto), quantita)
                    - Sum(Filter('arcade.riga_preventivo', codice_voce = v.codice_voce &&
                            id_preventivo in colPrevAperti.id_preventivo), quantita) }))
        Size: =0
        Text: ="Pulsante"
        Visible: =false
        X: =233
        Y: =17
        ZIndex: =10

