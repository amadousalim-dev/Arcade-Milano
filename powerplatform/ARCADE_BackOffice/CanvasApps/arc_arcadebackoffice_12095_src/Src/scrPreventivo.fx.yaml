        btnSalvaBozza As modernButton:
            AccessibleLabel: ="1"
            BasePaletteColor: =nfAccentoNuovoPrev
            BorderStyle: =""
            Color: =nfColoreTestoSuAccento
            DisplayMode: |-
                =If(gblPuo.preventivi && gblStato = "bozza" && gblTot.valido && !IsBlank(cmbEspositore.Selected),
                     DisplayMode.Edit, DisplayMode.Disabled)
            Font: =""
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: |-
                =With({
                  nuovo: IsBlank(gblIdPreventivo),
                     idP: Coalesce(gblIdPreventivo, Coalesce(Max('arcade.preventivo', id_preventivo), 0) + 1)
                },
                  IfError(
                    // 1. testata
                    Patch('arcade.preventivo',
                      If(nuovo, Defaults('arcade.preventivo'), LookUp('arcade.preventivo', id_preventivo = idP)),
                      { id_preventivo: idP,
                        id_edizione: EdizioneSel.id_edizione,
                        id_espositore: cmbEspositore.Selected.id_espositore,
                        codice_stand: gblStand.codice_stand,
                        data_creazione: Today(),
                        imponibile_listino_eur: gblTot.listino,
                        sconto_pct: gblTot.sconto,
                        imponibile_eur: gblTot.imponibile,
                        stato: "bozza",
                        in_prelazione: gblFedelta,
                        aliquota_iva: AliquotaIvaStd });
                    // 2. righe: si cancellano e si riscrivono, numerate da 1
                    RemoveIf('arcade.riga_preventivo', id_preventivo = idP);
                    ForAll(Sequence(CountRows(colRighe)) As i,
                      With({ r: Index(colRighe, i.Value) },
                        Patch('arcade.riga_preventivo', Defaults('arcade.riga_preventivo'), {
                          id_preventivo: idP, riga: i.Value, codice_voce: r.codice_voce,
                          descrizione: r.descrizione, quantita: r.quantita,
                          prezzo_unitario: r.prezzo_unitario, importo_eur: r.importo_eur })));
                    Set(gblIdPreventivo, idP);
                    Set(gblPreventivo, LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo));
                    Set(gblStato, gblPreventivo.stato);
                    Notify("Bozza salvata", NotificationType.Success),
                
                    // in caso di errore: prima si rimette a posto, poi si avvisa
                    If(nuovo,
                      RemoveIf('arcade.riga_preventivo', id_preventivo = idP);
                      RemoveIf('arcade.preventivo', id_preventivo = idP));
                    Notify("Salvataggio non riuscito: " & FirstError.Message, NotificationType.Error)
                  )
                ); Select(btnCaricaImpegni)
            Size: =0
            Text: ="Salva Bozza"
            ZIndex: =1

        btnInvia As modernButton:
            AccessibleLabel: ="1"
            BasePaletteColor: =nfAccentoPreventivi
            BorderStyle: =""
            Color: =nfColoreTestoSuAccento
            DisplayMode: |
                =If(gblPuo.preventivi && gblStato = "bozza" && !IsBlank(gblIdPreventivo),
                     DisplayMode.Edit, DisplayMode.Disabled)
            Font: =""
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: |-
                =Refresh('arcade.preventivo'); Refresh('arcade.contratto');
                
                // contratti attivi dell'edizione (filtro semplice: funziona)
                ClearCollect(colInvAttivi,
                  Filter('arcade.contratto', id_edizione = EdizioneSel.id_edizione && stato = "attivo"));
                // preventivi dell'edizione: al database solo il filtro sull'edizione...
                ClearCollect(colInvAperti,
                  Filter('arcade.preventivo', id_edizione = EdizioneSel.id_edizione));
                // ...poi nell'app tengo solo quelli aperti, escluso quello che sto inviando
                RemoveIf(colInvAperti,
                  !(stato = "in_approvazione" || (stato = "inviato" && valido_fino >= Today())) ||
                  id_preventivo = gblIdPreventivo);
                
                If(
                  // 1. c'è una sponsorizzazione del preventivo non più disponibile?
                  CountRows(Filter(colRighe As r,
                    StartsWith(r.codice_voce, "SP-") &&
                    LookUp(colListinoVend, codice_voce = r.codice_voce).quantita_disponibile
                      - Sum(Filter('arcade.riga_contratto', codice_voce = r.codice_voce &&
                              id_contratto in colInvAttivi.id_contratto), quantita)
                      - Sum(Filter('arcade.riga_preventivo', codice_voce = r.codice_voce &&
                              id_preventivo in colInvAperti.id_preventivo), quantita)
                      < r.quantita)) > 0,
                  Notify("Una sponsorizzazione del preventivo non è più disponibile: toglila prima di inviare",
                         NotificationType.Error),
                
                  // 2. lo stand nel frattempo è stato venduto o opzionato da un altro preventivo?
                  !IsBlank(LookUp(colInvAttivi, codice_stand = gblStand.codice_stand)) ||
                  !IsBlank(LookUp(colInvAperti, codice_stand = gblStand.codice_stand)),
                  Notify("Lo stand non è più disponibile", NotificationType.Error),
                
                  // 3. tutto a posto: invio
                  With({ p: LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo) },
                    IfError(
                      If(p.sconto_pct > SogliaApprovazione,
                        // sconto oltre il 10%: va al direttore commerciale
                        Patch('arcade.preventivo', p, { stato: "in_approvazione" }),
                        // sconto fino al 10%: inviato e valido 30 giorni
                        Patch('arcade.preventivo', p, { stato: "inviato", inviato_il: Now(),
                          valido_fino: DateAdd(Today(), GiorniValidita, TimeUnit.Days) }));
                      Set(gblPreventivo, LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo));
                      Set(gblStato, gblPreventivo.stato);
                      Notify("Preventivo " & Substitute(gblStato, "_", " "), NotificationType.Success),
                
                      // errore: di solito l'indice univoco del database ha rifiutato
                      Notify("Lo stand è già opzionato da un altro preventivo", NotificationType.Error)
                    )
                  )
                );
                Select(btnCaricaImpegni)
            Size: =0
            Text: ="Invia"
            ZIndex: =2

        btnPerso As modernButton:
            AccessibleLabel: ="1"
            BasePaletteColor: =nfStatoVenduto
            BorderStyle: =""
            Color: =nfColoreTestoSuAccento
            DisplayMode: =If(gblPuo.preventivi && gblStato = "inviato", DisplayMode.Edit, DisplayMode.Disabled)
