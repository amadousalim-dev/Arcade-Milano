            ="Totale: " & If(IsBlank(gblContratto.aliquota_iva), "—",
                 Text(gblContratto.imponibile_eur + Round(gblContratto.imponibile_eur * gblContratto.aliquota_iva, 2),
                      "[$-en-US]#,##0.00", "it-IT") & " €")
        Width: =321
        X: =63
        Y: =619
        ZIndex: =10

    "galPagamenti As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        AccessibleLabel: ="1"
        BorderColor: =App.Theme.Colors.Darker40
        DelayItemLoading: =true
        Height: =388
        Items: =Sort(Filter('arcade.pagamento', id_contratto = gblIdContratto), tipo)
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TabIndex: =1
        TemplatePadding: =0
        TemplateSize: =197
        Width: =709
