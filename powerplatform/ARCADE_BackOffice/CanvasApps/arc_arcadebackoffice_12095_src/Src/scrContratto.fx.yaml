            DisabledColor: =RGBA(166, 166, 166, 1)
            Fill: |-
                =Switch(true,
                  ThisItem.annullato, nfPagNeutro,
                  IsBlank(ThisItem.pagato_il) && ThisItem.scadenza < Today(), nfPagScaduto,
                  IsBlank(ThisItem.pagato_il), nfPagNeutro,
                  ThisItem.pagato_il > ThisItem.scadenza, nfPagRitardo,
                  nfPagRegolare)
            Font: =App.Theme.Font
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
