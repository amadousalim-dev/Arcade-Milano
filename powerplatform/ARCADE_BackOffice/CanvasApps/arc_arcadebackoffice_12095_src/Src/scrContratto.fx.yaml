scrContratto As screen:
    CopilotContext: |-
        ={ ScreenName: Self.Name }
    CopilotPromptSuggestions: =[]
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =Refresh('arcade.contratto'); Refresh('arcade.riga_contratto'); Refresh('arcade.pagamento');
        Set(gblContratto, LookUp('arcade.contratto', id_contratto = gblIdContratto)); ClearCollect(colPagamenti,
          ShowColumns(Filter('arcade.pagamento', id_contratto = gblIdContratto),
            id_pagamento, tipo, importo, scadenza, pagato_il, data_dedotta, annullato))

    btnIndietroContr As icon:
        AccessibleLabel: ="1"
        BorderColor: =App.Theme.Colors.Darker40
        Color: =App.Theme.Colors.Darker30
        DisabledBorderColor: =RGBA(166, 166, 166, 1)
        DisabledColor: =RGBA(244, 244, 244, 1)
        Height: =61
        Icon: =Icon.BackArrow
        OnSelect: =Navigate(scrStand)
        TabIndex: =1
        Width: =53
        X: =34
        Y: =3
        ZIndex: =1

    lblTitoloContr As label:
        AutoHeight: =true
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        FocusedBorderThickness: =1
        Font: =App.Theme.Font
        Height: =42
        Size: =21
        TabIndex: =1
        Text: ="Contratto " & gblContratto.id_contratto & " – stand " & gblContratto.codice_stand
        Width: =650
        X: =260
        Y: =11
        ZIndex: =2

    lblTitoloContr_1 As label:
        AutoHeight: =true
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        FocusedBorderThickness: =1
        Font: =App.Theme.Font
        Height: =42
        Size: =21
        TabIndex: =1
        Text: =Upper(gblContratto.stato)
        Width: =305
        X: =1022
        Y: =11
        ZIndex: =3

    lblContrDati As label:
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        Height: =319
        Size: =21
        Text: |-
            ="Espositore: " & LookUp(colEspositori, id_espositore = gblContratto.id_espositore).ragione_sociale & Char(10) &
            "Edizione: " & gblContratto.id_edizione & Char(10) &
            "Data firma: " & Text(gblContratto.data_firma, "dd/mm/yyyy") & Char(10) &
            "Rinnovo: " & If(gblContratto.rinnovo, "Sì", "No") & Char(10) &
            If(IsBlank(gblContratto.id_preventivo),
               "Contratto storico (senza preventivo)",
               "Da preventivo n. " & gblContratto.id_preventivo)
        Width: =352
        X: =63
        Y: =81
        ZIndex: =4

    "galRigheContr As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        AccessibleLabel: ="1"
        BorderColor: =App.Theme.Colors.Darker40
        DelayItemLoading: =true
