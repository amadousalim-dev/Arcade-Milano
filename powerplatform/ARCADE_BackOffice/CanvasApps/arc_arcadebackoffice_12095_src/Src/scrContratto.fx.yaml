            X: =103
            Y: =71
            ZIndex: =8

    lblContrListino As label:
        AutoHeight: =true
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        Size: =11
        Text: |-
            ="Imponibile: " & Text(gblContratto.imponibile_listino_eur, "[$-en-US]#,##0.00", "it-IT") & " €"
        Width: =321
        X: =63
        Y: =459
        ZIndex: =6

    lblContrSconto As label:
        AutoHeight: =true
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        FocusedBorderThickness: =1
        Font: =App.Theme.Font
        Size: =11
        TabIndex: =1
        Text: |-
            ="Sconto: " & Text(gblContratto.sconto_pct * 100, "[$-en-US]0.0", "it-IT") & "%"
        Width: =321
        X: =63
        Y: =499
        ZIndex: =7

    lblContrImponibile As label:
        AutoHeight: =true
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        FocusedBorderThickness: =1
        Font: =App.Theme.Font
        Size: =11
        TabIndex: =1
        Text: |-
            ="Imponibile: " & Text(gblContratto.imponibile_eur, "[$-en-US]#,##0.00", "it-IT") & " €"
        Width: =321
        X: =63
        Y: =539
        ZIndex: =8

    lblContrIva As label:
        AutoHeight: =true
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        FocusedBorderThickness: =1
        Font: =App.Theme.Font
        Size: =11
        TabIndex: =1
        Text: |-
            ="IVA: " & If(IsBlank(gblContratto.aliquota_iva),
                 "non registrata (contratto storico)",
                 Text(Round(gblContratto.imponibile_eur * gblContratto.aliquota_iva, 2),
                      "[$-en-US]#,##0.00", "it-IT") & " €")
        Width: =321
        X: =63
        Y: =579
        ZIndex: =9

    ContrTotale As label:
        AutoHeight: =true
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
