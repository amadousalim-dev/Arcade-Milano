scrListino As screen:
    ContentLanguage: =""
    CopilotContext: |-
        ={ ScreenName: Self.Name }
    CopilotPromptSuggestions: =[]
    Fill: =nfColoreSfondo
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =ClearCollect(colListinoVista,
          ShowColumns(Filter('arcade.listino', id_edizione = EdizioneSel.id_edizione),
            codice_voce, descrizione, tipo_voce, unita, prezzo_unitario,
            quantita_disponibile, codice_padiglione_vincolo, note))

    RectQuickActionBar1 As rectangle:
        BorderColor: =App.Theme.Colors.Darker40
        Fill: =nfColoreSuperficie
        Height: =64
        Width: =Parent.Width
        ZIndex: =1

    Title2 As label:
        Align: =Align.Center
        Color: =nfColoreTesto
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        FontWeight: =FontWeight.Bold
        Height: =64
        PaddingRight: =10
        Size: =nfDimTitolo
        Text: ="Listino prezzi · " & EdizioneSel.nome
        Width: =Parent.Width
        ZIndex: =2

    "galListino As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtro applicato"
        BorderColor: =nfAccentoPrimario
        BorderThickness: =nfSpessoreBordo
        DelayItemLoading: =true
        Fill: =nfColoreSuperficie
        Height: =639
        Items: |-
            =SortByColumns(
              Filter(colListinoVista,
                drpTipoVoce.Selected.Value = "Tutti" || tipo_voce = drpTipoVoce.Selected.Value),
              "tipo_voce", SortOrder.Ascending, "codice_voce", SortOrder.Ascending)
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =205
        Width: =Parent.Width
        Y: =124
        ZIndex: =3

        lblLisCodice As label:
            AutoHeight: =true
            Color: =nfColoreTesto
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =nfDimTesto
            Text: =ThisItem.codice_voce
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 173
            X: =86
            Y: =2
            ZIndex: =1

        Separator6 As rectangle:
            BorderColor: =App.Theme.Colors.Darker40
            Fill: =nfColoreSfondo
            Height: =8
            OnSelect: =Select(Parent)
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - Self.Height
            ZIndex: =2

        Rectangle3 As rectangle:
            BorderColor: =App.Theme.Colors.Darker40
            Fill: =nfAccentoPrimario
            Height: =Parent.TemplateHeight - Separator6.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =4
            ZIndex: =3

        lblLisDescr As label:
            AutoHeight: =true
            Color: =nfColoreTesto
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =nfDimTesto
            Text: =ThisItem.descrizione
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 173
            X: =86
            Y: =36
            ZIndex: =4

        lblLisTipo As label:
            AutoHeight: =true
            Color: =nfColoreTestoSecondario
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =nfDimTesto
            Text: =Proper(ThisItem.tipo_voce)
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 173
            X: =86
            Y: =68
            ZIndex: =5

        lblLisPrezzo As label:
            AutoHeight: =true
            Color: =nfColoreTesto
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =nfDimTesto
            Text: |-
                =If(IsBlank(ThisItem.prezzo_unitario), "—",
                     ThisItem.tipo_voce = "maggiorazione" || ThisItem.unita = "%",
                       Text(ThisItem.prezzo_unitario * 100, "[$-en-US]0", "it-IT") & "%",
                     Text(ThisItem.prezzo_unitario, "[$-en-US]#,##0.00", "it-IT") & " € / " & ThisItem.unita)
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 173
            X: =86
            Y: =106
            ZIndex: =6

        lblLisNote As label:
            AutoHeight: =true
            Color: =nfColoreTestoSecondario
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =nfDimTesto
            Text: |-
                =If(!IsBlank(ThisItem.quantita_disponibile),
                       "Pacchetti per edizione: " & ThisItem.quantita_disponibile & "  ", "") &
                  If(!IsBlank(ThisItem.codice_padiglione_vincolo),
                       "Solo padiglione " & ThisItem.codice_padiglione_vincolo & "  ", "") &
                  Coalesce(ThisItem.note, "")
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 173
            X: =86
            Y: =139
            ZIndex: =7

    drpTipoVoce As modernDropdown:
        Appearance: =Appearance.FilledDarker
        BorderStyle: =""
        Default: |-
            ={Value: "Tutti"}
        Font: =""
        ItemDisplayText: =ThisItem.Value
        Items: =["Tutti", "spazio", "maggiorazione", "extra", "sponsorizzazione", "condizione"]
        Required: =false
        ValidationState: =ValidationState.None
        X: =54
        Y: =75
        ZIndex: =4

    btnIndietroListino As icon:
        AccessibleLabel: ="Torna alla home"
        BorderColor: =App.Theme.Colors.Darker40
        Color: =nfColoreTesto
        DisabledBorderColor: =RGBA(166, 166, 166, 1)
        DisabledColor: =RGBA(244, 244, 244, 1)
        Height: =40
        Icon: =Icon.BackArrow
        OnSelect: =Navigate(scrHome)
        TabIndex: =1
        Width: =40
        X: =13
        Y: =12
        ZIndex: =5

