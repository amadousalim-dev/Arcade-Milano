App:
  Properties:
    Formulas: |-
      =// Parametri di business: un solo punto da cambiare
      SogliaApprovazione = 0.10;       // oltre serve il direttore commerciale
      ScontoMassimo = 0.20;            // oltre non si scende
      AliquotaIvaStd = 0.22;
      GiorniValidita = 30;             // validità del preventivo dall'invio
      GiorniAvvisoApprovazione = 3;    // regola proposta al cliente
      GiorniMaxApprovazione = 7;

      // Edizione delle vendite e scadenze calcolate dalla data di apertura
      EdizioneSel = LookUp('arcade.edizione', id_edizione = 2026);
      ScadenzaSaldo = DateAdd(EdizioneSel.data_inizio, -30, TimeUnit.Days);
      // TEMPORANEO finché non esiste la colonna edizione.chiusura_vendite
      ChiusuraVendite = DateAdd(EdizioneSel.data_inizio, -15, TimeUnit.Days);

      // Tema grafico (stile di scrHome): solo aspetto, nessuna logica
      nfColoreSfondo = RGBA(18, 19, 31, 1);             // sfondo delle schermate
      nfColoreSuperficie = RGBA(30, 32, 51, 1);         // riquadri, intestazioni, pannelli
      nfColoreTesto = RGBA(255, 255, 255, 1);           // testo principale
      nfColoreTestoSecondario = RGBA(201, 204, 224, 1); // descrizioni, testo secondario
      nfColoreTestoSuAccento = RGBA(18, 19, 31, 1);     // testo sopra un colore acceso
      nfAccentoStand = RGBA(0, 229, 255, 1);            // ciano
      nfAccentoPreventivi = RGBA(255, 79, 163, 1);      // magenta
      nfAccentoNuovoPrev = RGBA(255, 210, 63, 1);       // giallo
      nfAccentoContratti = RGBA(61, 220, 132, 1);       // verde
      nfAccentoPrimario = nfAccentoStand;               // accento generico dell'app
      nfSpessoreBordo = 2;
      nfRaggio = 12;
      nfDimTitolo = 26;
      nfDimSottotitolo = 15;
      nfDimTitoloRiquadro = 20;
      nfDimTesto = 14;
      // Colori degli stati dello stand e della riga selezionata
      nfStatoLibero = RGBA(61, 220, 132, 1);
      nfStatoOpzionato = RGBA(255, 210, 63, 1);
      nfStatoPrelazione = RGBA(100, 181, 246, 1);
      nfStatoVenduto = RGBA(158, 158, 158, 1);
      nfColoreSelezione = RGBA(0, 229, 255, 0.15);
      // Colori degli stati dei pagamenti (scrContratto)
      nfPagNeutro = nfStatoVenduto;                 // grigio: annullato, da pagare
      nfPagScaduto = RGBA(255, 82, 82, 1);         // rosso
      nfPagRitardo = RGBA(255, 152, 0, 1);         // arancione
      nfPagRegolare = nfAccentoContratti;          // verde
      // Colori di avviso generici
      nfColoreErrore = RGBA(255, 82, 82, 1);       // rosso
      nfColoreAttenzione = RGBA(255, 152, 0, 1);   // arancione
      // Colori di stato generici (stesso significato in tutte le schermate)
      nfColoreOk = RGBA(61, 220, 132, 1);        // verde: ok, pagato, disponibile
      nfColoreNeutro = RGBA(158, 158, 158, 1);   // grigio: neutro, disdetto, da pagare
    OnStart: |-
      =IfError(
        Set(gblUtente, LookUp('arcade.utente', Lower(email) = Lower(User().Email))),
        Set(gblUtente, LookUp('arcade.utente', Lower(email) = Lower(User().Email)))
      );
      ClearCollect(colEspositori, Sort('arcade.espositore', ragione_sociale));
      ClearCollect(colEdizioni, Sort('arcade.edizione', id_edizione, SortOrder.Descending));
      Set(gblUtente, LookUp('arcade.utente', Lower(email) = Lower(User().Email)));
      // ruolo dell'utente collegato; "nessuno" se l'e-mail non è nella tabella utente
      Set(gblRuolo, Coalesce(gblUtente.ruolo, "nessuno"));
      // matrice dei permessi: è l'unico punto da cambiare se cambiano le regole
      Set(gblPuo, {
          entrare:    gblRuolo in ["commerciale", "direttore_commerciale", "amministrazione"],
          preventivi: gblRuolo in ["commerciale", "direttore_commerciale"],
          approvare:  gblRuolo = "direttore_commerciale",
          firmare:    gblRuolo in ["commerciale", "direttore_commerciale"],
          incassi:    gblRuolo = "amministrazione",
          deroga:     gblRuolo = "amministrazione",
          variazioni: gblRuolo in ["direttore_commerciale", "amministrazione"]
      })
    StartScreen: =scrHome
    Theme: =PowerAppsTheme
