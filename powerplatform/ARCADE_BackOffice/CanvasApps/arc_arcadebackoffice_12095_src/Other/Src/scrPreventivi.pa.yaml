Screens:
  scrPreventivi:
    Children:
      - ScreenContainer1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =400
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - btnIndietroPrev:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="1"
                        Height: =61
                        Icon: =Icon.BackArrow
                        OnSelect: =Navigate(scrStand)
                        TabIndex: =1
                        Width: =53
                        X: =34
                        Y: =3
                  - drpStatoPrev:
                      Control: ModernDropdown@1.0.3
                      Properties:
                        AccessibleLabel: ="1"
                        Default: |-
                          ={Value: "Tutti"}
                        ItemDisplayText: =ThisItem.Value
                        Items: =["Tutti", "bozza", "in_approvazione", "inviato", "accettato", "perso", "scaduto"]
                        OnChange: =
                        Size: =21
                        Width: =280
                        X: =719
                        Y: =33
            - MainContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - galPreventivi:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        AccessibleLabel: ="1"
                        Items: |-
                          =SortByColumns(
                            Filter('arcade.preventivo',
                              id_edizione = EdizioneSel.id_edizione &&
                              (drpStatoPrev.Selected.Value = "Tutti" || stato = drpStatoPrev.Selected.Value)),
                            "id_preventivo", SortOrder.Descending)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Set(gblIdPreventivo, ThisItem.id_preventivo);
                          Set(gblStand, LookUp(colStatoStand, codice_stand = ThisItem.codice_stand));
                          Navigate(scrPreventivo)
                        TabIndex: =1
                      Children:
                        - Image4:
                            Control: Image@2.2.3
                            Properties:
                              Height: =72
                              OnSelect: =Select(Parent)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =72
                              X: =16
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                        - lblPrevNumero:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="n. " & ThisItem.id_preventivo
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.TemplateWidth - 173
                              X: =103
                              Y: =6
                        - lblPrevStand:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =ThisItem.codice_stand
                              VerticalAlign: =VerticalAlign.Top
                              Width: =60
                              X: =179
                              Y: =6
                        - NextArrow5:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: =Self.Tooltip
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(166, 166, 166, 1)
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              DisabledColor: =RGBA(119, 119, 119, 1)
                              Height: =50
                              Icon: =Icon.ChevronRight
                              OnSelect: =Select(Parent)
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              Tooltip: ="Visualizza dettagli elementi"
                              Width: =50
                              X: =Parent.TemplateWidth - Self.Width - 12
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                        - Separator5:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =8
                              OnSelect: =Select(Parent)
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - Self.Height
                        - Rectangle4:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =App.Theme.Colors.Darker30
                              Height: =Parent.TemplateHeight - Separator5.Height
                              OnSelect: =Select(Parent)
                              Visible: =ThisItem.IsSelected
                              Width: =4
                        - lblPrevStato:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =Upper(Substitute(ThisItem.stato, "_", " ")) &
                                  If(ThisItem.stato = "inviato" && ThisItem.valido_fino < Today(), " – scaduto, da aggiornare", "")
                              VerticalAlign: =VerticalAlign.Top
                              Width: =lblPrevNumero.Width
                              X: =103
                              Y: =52
                        - lblPrevImporto:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =Text(ThisItem.imponibile_eur, "[$-en-US]#,##0.00", "it-IT") & " €"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =lblPrevNumero.Width
                              X: =103
                              Y: =31
                        - lblPrevEsp:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =LookUp(colEspositori, id_espositore = ThisItem.id_espositore).ragione_sociale
                              VerticalAlign: =VerticalAlign.Top
                              Width: =1056
                              X: =262
                              Y: =6
                        - lblPrevValido:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =If(IsBlank(ThisItem.valido_fino), "",
                                                         "valido fino al " & Text(ThisItem.valido_fino, "dd/mm/yyyy"))
                              VerticalAlign: =VerticalAlign.Top
                              Width: =lblPrevNumero.Width
                              X: =103
                              Y: =77
            - FooterContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
