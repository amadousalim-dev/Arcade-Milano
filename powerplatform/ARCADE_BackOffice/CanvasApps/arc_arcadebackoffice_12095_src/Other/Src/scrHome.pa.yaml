                                    LayoutMinHeight: =44
                                    LayoutMinWidth: =44
                                    Width: =44
                              - lblHomeNuovoPrevTit:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfColoreTesto
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    PaddingLeft: =0
                                    Role: =TextRole.Heading2
                                    Size: =nfDimTitoloRiquadro
                                    Text: ="Nuovo preventivo"
                              - lblHomeNuovoPrevDesc:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfColoreTestoSecondario
                                    FillPortions: =1
                                    LayoutMinHeight: =28
                                    PaddingLeft: =0
                                    Size: =nfDimTesto
                                    Text: ="Scegli uno stand libero per creare un preventivo"
                                    VerticalAlign: =VerticalAlign.Top
                              - btnHomeNuovoPrev:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Apri Nuovo preventivo"
                                    BasePaletteColor: =nfAccentoNuovoPrev
                                    Color: =nfColoreTestoSuAccento
