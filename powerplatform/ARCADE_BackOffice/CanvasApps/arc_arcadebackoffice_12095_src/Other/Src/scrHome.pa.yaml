Screens:
  scrHome:
    Children:
      - Label1:
          Control: Label@2.5.1
          Properties:
            Text: "=\"Stand: \" & CountRows('arcade.stand') "
            X: =40
            Y: =40
      - Label1_1:
          Control: Label@2.5.1
          Properties:
            Text: "=\"Espositori: \" & CountRows('arcade.espositore') "
            X: =40
            Y: =100
      - Label1_2:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="Contratti 2025: " &
                  CountRows(Filter('arcade.contratto', id_edizione = 2025))
            Width: =170
            X: =40
            Y: =160
      - Label1_3:
          Control: Label@2.5.1
          Properties:
            Height: =42
            Text: |-
              ="Apertura 2026: " & Text(LookUp('arcade.edizione', id_edizione = 2026).data_inizio, "dd/mm/yyyy")
            Width: =267
            X: =40
            Y: =217
