                                    LayoutMinWidth: =140
                                    OnSelect: =Navigate(scrStand)
                                    Text: ="Apri ›"
                                    Width: =140
                        - conHomeContratti:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfAccentoContratti
                              BorderThickness: =nfSpessoreBordo
                              DropShadow: =DropShadow.None
                              Fill: =nfColoreSuperficie
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =180
                              LayoutMinWidth: =280
                              PaddingBottom: =20
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =20
                              RadiusBottomLeft: =nfRaggio
                              RadiusBottomRight: =nfRaggio
                              RadiusTopLeft: =nfRaggio
                              RadiusTopRight: =nfRaggio
                            Children:
                              - icoHomeContratti:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Color: =nfAccentoContratti
                                    Height: =44
                                    Icon: =Icon.DocumentWithContent
                                    LayoutMinHeight: =44
                                    LayoutMinWidth: =44
                                    Width: =44
                              - lblHomeContrattiTit:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfColoreTesto
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    PaddingLeft: =0
                                    Role: =TextRole.Heading2
                                    Size: =nfDimTitoloRiquadro
                                    Text: ="Contratti"
                              - lblHomeContrattiDesc:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =nfColoreTestoSecondario
                                    FillPortions: =1
                                    LayoutMinHeight: =28
                                    PaddingLeft: =0
