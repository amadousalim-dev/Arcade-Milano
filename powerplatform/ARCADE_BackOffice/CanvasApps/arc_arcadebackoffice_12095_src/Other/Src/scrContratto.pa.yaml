Screens:
  scrContratto:
    Properties:
      OnVisible: |-
        =Refresh('arcade.contratto'); Refresh('arcade.riga_contratto'); Refresh('arcade.pagamento');
        Set(gblContratto, LookUp('arcade.contratto', id_contratto = gblIdContratto)); ClearCollect(colPagamenti,
          ShowColumns(Filter('arcade.pagamento', id_contratto = gblIdContratto),
            id_pagamento, tipo, importo, scadenza, pagato_il, data_dedotta, annullato))
    Children:
      - btnIndietroContr:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="1"
            Height: =61
            Icon: =Icon.BackArrow
            OnSelect: =Navigate(scrStand)
            TabIndex: =1
            Width: =53
            X: =34
            Y: =3
      - lblTitoloContr:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            FocusedBorderThickness: =1
            Height: =42
            Size: =21
            TabIndex: =1
            Text: ="Contratto " & gblContratto.id_contratto & " – stand " & gblContratto.codice_stand
            Width: =650
            X: =260
            Y: =11
      - lblTitoloContr_1:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            FocusedBorderThickness: =1
            Height: =42
            Size: =21
            TabIndex: =1
            Text: =Upper(gblContratto.stato)
            Width: =305
            X: =1022
            Y: =11
      - lblContrDati:
          Control: Label@2.5.1
          Properties:
            Height: =319
            Size: =21
            Text: |-
              ="Espositore: " & LookUp(colEspositori, id_espositore = gblContratto.id_espositore).ragione_sociale & Char(10) &
              "Edizione: " & gblContratto.id_edizione & Char(10) &
              "Data firma: " & Text(gblContratto.data_firma, "dd/mm/yyyy") & Char(10) &
              "Rinnovo: " & If(gblContratto.rinnovo, "Sì", "No") & Char(10) &
              If(IsBlank(gblContratto.id_preventivo),
                 "Contratto storico (senza preventivo)",
                 "Da preventivo n. " & gblContratto.id_preventivo)
            Width: =352
            X: =63
            Y: =81
      - galRigheContr:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            AccessibleLabel: ="1"
            Height: =304
            Items: =Sort(Filter('arcade.riga_contratto', id_contratto = gblIdContratto), riga)
            TabIndex: =1
            TemplateSize: =100
            Width: =712
            X: =630
            Y: =88
          Children:
            - Title1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.descrizione
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 173
                  X: =103
            - Subtitle2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    ="Quantità: " & ThisItem.quantita
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title1.Width
                  X: =103
                  Y: =25
            - Separator3:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 3)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle2:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =App.Theme.Colors.Darker30
                  Height: =Parent.TemplateHeight - Separator3.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
            - Subtitle2_1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    ="Prezzo unitario: " & ThisItem.prezzo_unitario & " €"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title1.Width
                  X: =103
                  Y: =52
            - Subtitle2_2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    ="Importo: " & ThisItem.importo_eur & " €"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title1.Width
                  X: =103
                  Y: =71
      - lblContrListino:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Size: =11
            Text: |-
              ="Imponibile: " & Text(gblContratto.imponibile_listino_eur, "[$-en-US]#,##0.00", "it-IT") & " €"
            Width: =321
            X: =63
            Y: =459
      - lblContrSconto:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            FocusedBorderThickness: =1
            Size: =11
            TabIndex: =1
            Text: |-
              ="Sconto: " & Text(gblContratto.sconto_pct * 100, "[$-en-US]0.0", "it-IT") & "%"
            Width: =321
            X: =63
            Y: =499
      - lblContrImponibile:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            FocusedBorderThickness: =1
            Size: =11
            TabIndex: =1
            Text: |-
              ="Imponibile: " & Text(gblContratto.imponibile_eur, "[$-en-US]#,##0.00", "it-IT") & " €"
            Width: =321
            X: =63
            Y: =539
      - lblContrIva:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            FocusedBorderThickness: =1
            Size: =11
            TabIndex: =1
            Text: |-
              ="IVA: " & If(IsBlank(gblContratto.aliquota_iva),
                   "non registrata (contratto storico)",
                   Text(Round(gblContratto.imponibile_eur * gblContratto.aliquota_iva, 2),
                        "[$-en-US]#,##0.00", "it-IT") & " €")
            Width: =321
            X: =63
            Y: =579
      - ContrTotale:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            FocusedBorderThickness: =1
            Size: =11
            TabIndex: =1
            Text: |-
              ="Totale: " & If(IsBlank(gblContratto.aliquota_iva), "—",
                   Text(gblContratto.imponibile_eur + Round(gblContratto.imponibile_eur * gblContratto.aliquota_iva, 2),
                        "[$-en-US]#,##0.00", "it-IT") & " €")
            Width: =321
            X: =63
            Y: =619
      - galPagamenti:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            AccessibleLabel: ="1"
            Height: =388
            Items: =Sort(Filter('arcade.pagamento', id_contratto = gblIdContratto), tipo)
            TabIndex: =1
            TemplateSize: =197
            Width: =709
            X: =633
            Y: =364
          Children:
            - lblPagTipo:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: |-
                    ="Tipo: " & ThisItem.tipo
                  VerticalAlign: =VerticalAlign.Top
                  Width: =130
                  X: =92
                  Y: =38
            - Separator4:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - lblPagImporto:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: |-
                    ="Importo: " & Text(ThisItem.importo, "[$-en-US]#,##0.00", "it-IT") & " €"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =193
                  X: =92
                  Y: =63
            - lblPagScadenza:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: |-
                    ="Scadenza: " & Text(ThisItem.scadenza, "dd/mm/yyyy")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =193
                  X: =92
                  Y: =88
            - lblPagIncasso:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: |-
                    ="Stato Pagamento: " & If(IsBlank(ThisItem.pagato_il), "Non incassato",
                                             "Incassato il " & Text(ThisItem.pagato_il, "dd/mm/yyyy") &
                                             If(ThisItem.data_dedotta, " (data dedotta)", ""))
                  VerticalAlign: =VerticalAlign.Top
                  Width: =292
                  X: =92
                  Y: =113
            - lblPagStato:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  Fill: |-
                    =Switch(true,
                      ThisItem.annullato, ColorValue("#9E9E9E"),
                      IsBlank(ThisItem.pagato_il) && ThisItem.scadenza < Today(), ColorValue("#C62828"),
                      IsBlank(ThisItem.pagato_il), ColorValue("#9E9E9E"),
                      ThisItem.pagato_il > ThisItem.scadenza, ColorValue("#EF6C00"),
                      ColorValue("#2E7D32"))
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: |-
                    =Upper(Substitute(
                      If(ThisItem.annullato, "annullato",
                         IsBlank(ThisItem.pagato_il) && ThisItem.scadenza < Today(), "scaduto",
                         IsBlank(ThisItem.pagato_il), "da_pagare",
                         ThisItem.pagato_il > ThisItem.scadenza, "pagato_in_ritardo",
                         "pagato_nei_termini"), "_", " "))
                  VerticalAlign: =VerticalAlign.Top
                  Width: =130
                  X: =92
                  Y: =138
