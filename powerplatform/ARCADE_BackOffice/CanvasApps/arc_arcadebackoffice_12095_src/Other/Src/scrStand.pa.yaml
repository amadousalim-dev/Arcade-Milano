Screens:
  scrStand:
    Properties:
      OnVisible: =Select(btnCalcolaStati)
    Children:
      - drpEdizione:
          Control: ModernDropdown@1.0.3
          Properties:
            Default: =EdizioneSel
            ItemDisplayText: =ThisItem.nome
            Items: =Sort('arcade.edizione', id_edizione, SortOrder.Descending)
            OnChange: =Select(btnCalcolaStati)
            Width: =280
            X: =30
            Y: =33
      - btnCalcolaStati:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =With({ ed: drpEdizione.Selected },
                Refresh('arcade.contratto'); Refresh('arcade.preventivo');
                // stand che esistono in quell'edizione (attivo_dal <= anno)
                ClearCollect(colStandEd, Filter('arcade.stand', attivo_dal <= ed.id_edizione));
                // contratti attivi dell'edizione: rendono lo stand "venduto"
                ClearCollect(colContrattiAttivi,
                  Filter('arcade.contratto', id_edizione = ed.id_edizione && stato = "attivo"));
                // preventivi che bloccano lo stand (la bozza non blocca)
                ClearCollect(colPreventiviAperti,
                  Filter('arcade.preventivo', id_edizione = ed.id_edizione &&
                    (stato = "in_approvazione" ||
                     (stato = "inviato" && valido_fino >= Today()))));
                // stand venduti l'anno prima: servono alla prelazione
                ClearCollect(colVendutiPrec,
                  Filter('arcade.contratto', id_edizione = ed.id_edizione - 1 && stato = "attivo"));
                ClearCollect(colListino, Filter('arcade.listino', id_edizione = ed.id_edizione))
              );
              ClearCollect(colStatoStand,
                ForAll(colStandEd As s,
                  With({
                    c:    LookUp(colContrattiAttivi,  codice_stand = s.codice_stand),
                    p:    LookUp(colPreventiviAperti, codice_stand = s.codice_stand),
                    prec: LookUp(colVendutiPrec,      codice_stand = s.codice_stand),
                    ed:   drpEdizione.Selected,
                    prezzoMq: LookUp(colListino, codice_voce = "SPAZIO-" & s.codice_padiglione).prezzo_unitario,
                    pctMagg:  Coalesce(LookUp(colListino,
                                codice_voce = "MAGG-" & Upper(s.posizione)).prezzo_unitario, 0)
                  },
                  {
                    codice_stand: s.codice_stand,
                    codice_padiglione: s.codice_padiglione,
                    mq: s.mq,
                    posizione: s.posizione,
                    stato: If(
                      !IsBlank(c), "venduto",
                      !IsBlank(p), "opzionato",
                      !IsBlank(prec) && !IsBlank(ed.scadenza_prelazione)
                        && Today() <= ed.scadenza_prelazione, "in_prelazione",
                      "libero"),
                    id_espositore_rif: Coalesce(c.id_espositore, p.id_espositore, prec.id_espositore),
                    id_contratto: c.id_contratto,
                    id_preventivo: p.id_preventivo,
                    prezzo_listino: If(IsBlank(prezzoMq), Blank(), Round(s.mq * prezzoMq * (1 + pctMagg), 2)),
                    imponibile_contratto: c.imponibile_eur
                  })))
            Visible: =false
            X: =152
            Y: =269
      - lblLiberi:
          Control: ModernText@1.0.0
          Properties:
            Text: =CountIf(colStatoStand, stato = "libero")
            X: =53
            Y: =97
      - lblOpzionati:
          Control: ModernText@1.0.0
          Properties:
            Text: =CountIf(colStatoStand, stato = "opzionato")
            X: =224
            Y: =97
      - lblPrelaz:
          Control: ModernText@1.0.0
          Properties:
            Text: =CountIf(colStatoStand, stato = "in_prelazione")
            X: =408
            Y: =97
      - lblVenduti:
          Control: ModernText@1.0.0
          Properties:
            Text: =CountIf(colStatoStand, stato = "venduto")
            X: =666
            Y: =97
      - lblSatStand:
          Control: ModernText@1.0.0
          Properties:
            Text: =Text(CountIf(colStatoStand, stato = "venduto") / CountRows(colStatoStand) * 100, "[$-en-US]0.0", "it-IT") & "%"
            X: =892
            Y: =97
      - lblSatMq:
          Control: ModernText@1.0.0
          Properties:
            Text: =Text(Sum(Filter(colStatoStand, stato = "venduto"), mq) / Sum(colStatoStand, mq) * 100, "[$-en-US]0.0", "it-IT") & "%"
            X: =1120
            Y: =97
      - drpPadiglione:
          Control: ModernDropdown@1.0.3
          Properties:
            ItemDisplayText: =ThisItem.Value
            Items: =["Tutti","P1","P2","P3"]
            OnChange: =Select(btnCalcolaStati)
            Width: =280
            X: =384
            Y: =33
      - drpStato:
          Control: ModernDropdown@1.0.3
          Properties:
            ItemDisplayText: =ThisItem.Value
            Items: =["libero", "opzionato", "in_prelazione", "venduto"]
            OnChange: =Select(btnCalcolaStati)
            Width: =280
            X: =719
            Y: =33
      - drpPosizione:
          Control: ModernDropdown@1.0.3
          Properties:
            ItemDisplayText: =ThisItem.Value
            Items: =["Tutte", "linea", "angolo", "penisola", "isola"]
            OnChange: =Select(btnCalcolaStati)
            Width: =280
            X: =1055
            Y: =33
      - txtCerca:
          Control: ModernTextInput@1.1.3
          Properties:
            Placeholder: ="Cerca"
            X: =40
            Y: =151
      - galStand:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |-
              =SortByColumns(
                Filter(colStatoStand,
                  (drpPadiglione.Selected.Value = "Tutti" || codice_padiglione = drpPadiglione.Selected.Value) &&
                  (drpStato.Selected.Value = "Tutti"      || stato = drpStato.Selected.Value) &&
                  (drpPosizione.Selected.Value = "Tutte"  || posizione = drpPosizione.Selected.Value) &&
                  (IsBlank(txtCerca.Text) || StartsWith(codice_stand, Upper(txtCerca.Text)))),
                "codice_stand", SortOrder.Ascending)
            OnSelect: =galStand.Selected
            TemplateFill: =If(ThisItem.IsSelected, RGBA(0, 120, 212, 0.1), Color.Transparent)
            TemplateSize: =278
            Width: =Parent.Width * 0.6 - 30
            Y: =193
          Children:
            - Image1:
                Control: Image@2.2.3
                Properties:
                  Height: =72
                  OnSelect: =Select(Parent)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =72
                  X: =16
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Subtitle1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Fill: |-
                    =Switch(galStand.Selected.stato,
                             "libero",        ColorValue("#2E7D32"),
                             "opzionato",     ColorValue("#F9A825"),
                             "in_prelazione", ColorValue("#0277BD"),
                             "venduto",       ColorValue("#616161"))
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.stato
                  VerticalAlign: =VerticalAlign.Top
                  Width: =lblpadiglione.Width
                  X: =99
                  Y: =185
            - NextArrow1:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(166, 166, 166, 1)
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(119, 119, 119, 1)
                  Height: =50
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Tooltip: ="Visualizza dettagli elementi"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Separator1:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle1:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =App.Theme.Colors.Darker30
                  Height: =Parent.TemplateHeight - Separator1.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
            - lblpadiglione:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.codice_padiglione
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 173
                  X: =99
                  Y: =62
            - lblcodicestand:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.codice_stand
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 173
                  X: =99
                  Y: =29
            - lblmq:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.mq & " mq"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =lblpadiglione.Width
                  X: =99
                  Y: =95
            - lblprezzolistino:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.prezzo_listino & " €"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =lblpadiglione.Width
                  X: =99
                  Y: =123
            - lblposizione:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.posizione
                  VerticalAlign: =VerticalAlign.Top
                  Width: =lblpadiglione.Width
                  X: =99
                  Y: =156
      - conDettaglio:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderThickness: =1
            Fill: =Color.LightGray
            Height: =galStand.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Visible: =!IsBlank(galStand.Selected)
            Width: =Parent.Width - Self.X - 20
            X: =galStand.X + galStand.Width + 20
            Y: =galStand.Y
          Children:
            - lblDetTitolo:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =20
                  Text: ="Stand " & galStand.Selected.codice_stand
            - lblDetStato:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Fill: |-
                    =Switch(galStand.Selected.stato,
                             "libero",        ColorValue("#2E7D32"),
                             "opzionato",     ColorValue("#F9A825"),
                             "in_prelazione", ColorValue("#0277BD"),
                             "venduto",       ColorValue("#616161"))
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: =Upper(Substitute(galStand.Selected.stato, "_", " "))
            - lblDetDati:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: |-
                    ="Padiglione: " & galStand.Selected.codice_padiglione & Char(10) &
                    "Superficie: " & galStand.Selected.mq & " m²" & Char(10) &
                    "Posizione: " & galStand.Selected.posizione & Char(10) &
                    "Prezzo di listino: " &
                      If(IsBlank(galStand.Selected.prezzo_listino),
                         "non disponibile",
                         Text(galStand.Selected.prezzo_listino, "[$-en-US]#,##0.00", "it-IT") & " €") & If(!IsBlank(galStand.Selected.imponibile_contratto),
                         Char(10) & "Imponibile del contratto: " &
                         Text(galStand.Selected.imponibile_contratto, "[$-en-US]#,##0.00", "it-IT") & " €",
                         "")
            - lblDetEspositore:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: |-
                    =If(IsBlank(galStand.Selected.id_espositore_rif),
                       "Nessun espositore collegato",
                       Switch(galStand.Selected.stato,
                         "venduto",       "Venduto a: ",
                         "opzionato",     "Opzionato da: ",
                         "in_prelazione", "Riservato a: ") &
                       LookUp('arcade.espositore',
                         id_espositore = galStand.Selected.id_espositore_rif).ragione_sociale)
            - lblDetRiferimento:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: |-
                    =If(!IsBlank(galStand.Selected.id_contratto), "Contratto " & galStand.Selected.id_contratto,
                       !IsBlank(galStand.Selected.id_preventivo), "Preventivo n. " & galStand.Selected.id_preventivo,
                       "")
            - btnNuovoPreventivo:
                Control: ModernButton@1.0.0
                Properties:
                  DisplayMode: |-
                    =If(
                      drpEdizione.Selected.id_edizione = EdizioneSel.id_edizione &&
                      Today() <= ChiusuraVendite &&
                      galStand.Selected.stato in ["libero", "in_prelazione"],
                      DisplayMode.Edit, DisplayMode.Disabled)
                  Height: =40
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =Set(gblStand, galStand.Selected);
                               Set(gblIdPreventivo, Blank());   // nuovo preventivo
                               Set(gblIdPreventivo, If(false, 0));
                               Navigate(scrPreventivo)
                  Text: ="Nuovo Preventivo"
