                  - lblRigaPrezzo:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =nfColoreTestoSecondario
                        FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                        Height: =Self.Size * 1.8
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =nfDimTesto
                        Text: =Text(ThisItem.prezzo_unitario, "[$-en-US]#,##0.00", "it-IT")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =140
                        X: =Parent.TemplateWidth - 346
                        Y: =(Parent.TemplateHeight - Separator2.Height - Self.Height) / 2
                  - Separator2:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =nfColoreSfondo
                        Height: =8
                        OnSelect: =
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - Self.Height
                  - lblRigaPrezzo_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =nfColoreTesto
                        FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                        Height: =Self.Size * 1.8
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =nfDimTesto
                        Text: =Text(ThisItem.importo_eur, "[$-en-US]#,##0.00", "it-IT") & " €"
                        VerticalAlign: =VerticalAlign.Top
                        X: =Parent.TemplateWidth - 206
                        Y: =(Parent.TemplateHeight - Separator2.Height - Self.Height) / 2
                  - icoElimina:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="1"
                        Color: =nfColoreErrore
                        Height: =20
                        Icon: =Icon.Trash
                        OnSelect: =Remove(colRighe, ThisItem); Select(btnRicalcola)
                        TabIndex: =1
                        Visible: =!ThisItem.automatica && gblStato = "bozza"
                        Width: =20
                        X: =Parent.TemplateWidth - 44
                        Y: =(Parent.TemplateHeight - Separator2.Height - Self.Height) / 2
            - Container5:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =20
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - cmbVoce:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        InputTextPlaceholder: ="Scegli un extra o una sponsorizzazione"
                        ItemDisplayText: =ThisItem.descrizione
                        Items: =Filter(colListinoVend, tipo_voce in ["extra", "sponsorizzazione"])
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        SelectMultiple: =false
                  - txtQuantita:
                      Control: ModernTextInput@1.1.3
                      Properties:
                        AccessibleLabel: ="1"
                        Default: =If(cmbVoce.Selected.unita = "m²", gblStand.mq, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                  - btnAggiungiRiga:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="1"
                        BasePaletteColor: =nfAccentoPreventivi
                        Color: =nfColoreTestoSuAccento
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =With({
                            v: cmbVoce.Selected,
                            q: Value(txtQuantita.Text)
                          },
                            If(
                              IsBlank(v) || q <= 0,
                                Notify("Scegli una voce e una quantità maggiore di zero", NotificationType.Error),
                              !IsBlank(v.codice_padiglione_vincolo) && v.codice_padiglione_vincolo <> gblStand.codice_padiglione,
                                Notify(v.descrizione & " è riservata al padiglione " & v.codice_padiglione_vincolo, NotificationType.Error),
                              // sponsorizzazione: disponibili (già calcolati da btnCaricaImpegni)
                              // meno quelle già messe in questo preventivo
                              v.tipo_voce = "sponsorizzazione" &&
                                LookUp(colSponsorOccupati, codice_voce = v.codice_voce).disponibili
                                  - Sum(Filter(colRighe, codice_voce = v.codice_voce), quantita) < q,
                                Notify("Sponsorizzazione esaurita o già impegnata in un altro preventivo", NotificationType.Error),
                              Collect(colRighe, {
                                riga: Max(colRighe, riga) + 1, codice_voce: v.codice_voce, descrizione: v.descrizione,
                                quantita: q, prezzo_unitario: v.prezzo_unitario,
                                importo_eur: Round(q * v.prezzo_unitario, 2), automatica: false });
                              Select(btnRicalcola)
                            )
                          )
                        Text: ="Aggiungi Riga"
                        Width: =150
            - Container6:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =216
                  LayoutAlignItems: =LayoutAlignItems.End
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - lblImpListino:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =nfColoreTestoSecondario
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =nfDimTesto
                        Text: |-
                          ="Listino: " & Text(gblTot.listino, "[$-en-US]#,##0.00", "it-IT") & " €"
                        Width: =320
                        X: =148
                        Y: =16
                  - lblScontoEur:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =nfColoreTestoSecondario
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =nfDimTesto
                        Text: |-
                          ="Sconto (" & Text(gblTot.sconto * 100, "[$-en-US]0.0", "it-IT") & "%): -" & Text(gblTot.listino - gblTot.imponibile, "[$-en-US]#,##0.00", "it-IT") & " €"
                        Width: =320
                  - lblImponibile:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =nfColoreTestoSecondario
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =nfDimTesto
                        Text: |-
                          ="Imponibile: " & Text(gblTot.imponibile, "[$-en-US]#,##0.00", "it-IT") & " €"
                        Width: =320
                  - lblIva:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =nfColoreTestoSecondario
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =nfDimTesto
                        Text: |-
                          ="IVA " & Text(AliquotaIvaStd * 100, "[$-en-US]0", "it-IT") & "%: " & Text(gblTot.iva, "[$-en-US]#,##0.00", "it-IT") & " €"
                        Width: =320
                  - lblTotale:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =nfColoreTesto
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =nfDimTitoloRiquadro
                        Text: |-
                          ="Totale: " & Text(gblTot.totale, "[$-en-US]#,##0.00", "it-IT") & " €"
                        Width: =320
      - conAzioni:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =nfColoreSuperficie
            Height: =58
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =60
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =1366
            Y: =707
          Children:
            - btnSalvaBozza:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: ="1"
                  BasePaletteColor: =nfAccentoNuovoPrev
                  Color: =nfColoreTestoSuAccento
                  DisplayMode: |-
                    =If(gblStato = "bozza" && gblTot.valido && !IsBlank(cmbEspositore.Selected),
                         DisplayMode.Edit, DisplayMode.Disabled)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =With({
                      nuovo: IsBlank(gblIdPreventivo),
                         idP: Coalesce(gblIdPreventivo, Coalesce(Max('arcade.preventivo', id_preventivo), 0) + 1)
                    },
                      IfError(
                        // 1. testata
                        Patch('arcade.preventivo',
                          If(nuovo, Defaults('arcade.preventivo'), LookUp('arcade.preventivo', id_preventivo = idP)),
                          { id_preventivo: idP,
                            id_edizione: EdizioneSel.id_edizione,
                            id_espositore: cmbEspositore.Selected.id_espositore,
                            codice_stand: gblStand.codice_stand,
                            data_creazione: Today(),
                            imponibile_listino_eur: gblTot.listino,
                            sconto_pct: gblTot.sconto,
                            imponibile_eur: gblTot.imponibile,
                            stato: "bozza",
                            in_prelazione: gblFedelta,
                            aliquota_iva: AliquotaIvaStd });
                        // 2. righe: si cancellano e si riscrivono, numerate da 1
                        RemoveIf('arcade.riga_preventivo', id_preventivo = idP);
                        ForAll(Sequence(CountRows(colRighe)) As i,
                          With({ r: Index(colRighe, i.Value) },
                            Patch('arcade.riga_preventivo', Defaults('arcade.riga_preventivo'), {
                              id_preventivo: idP, riga: i.Value, codice_voce: r.codice_voce,
                              descrizione: r.descrizione, quantita: r.quantita,
                              prezzo_unitario: r.prezzo_unitario, importo_eur: r.importo_eur })));
                        Set(gblIdPreventivo, idP);
                        Set(gblPreventivo, LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo));
                        Set(gblStato, gblPreventivo.stato);
                        Notify("Bozza salvata", NotificationType.Success),

                        // in caso di errore: prima si rimette a posto, poi si avvisa
                        If(nuovo,
                          RemoveIf('arcade.riga_preventivo', id_preventivo = idP);
                          RemoveIf('arcade.preventivo', id_preventivo = idP));
                        Notify("Salvataggio non riuscito: " & FirstError.Message, NotificationType.Error)
                      )
                    ); Select(btnCaricaImpegni)
                  Text: ="Salva Bozza"
            - btnInvia:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: ="1"
                  BasePaletteColor: =nfAccentoPreventivi
                  Color: =nfColoreTestoSuAccento
                  DisplayMode: |
                    =If(gblStato = "bozza" && !IsBlank(gblIdPreventivo),
                         DisplayMode.Edit, DisplayMode.Disabled)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =Refresh('arcade.preventivo'); Refresh('arcade.contratto');
                    With({
                      attivi: Filter('arcade.contratto', id_edizione = EdizioneSel.id_edizione && stato = "attivo"),
                      aperti: Filter('arcade.preventivo', id_edizione = EdizioneSel.id_edizione &&
                                id_preventivo <> gblIdPreventivo &&
                                (stato = "in_approvazione" || (stato = "inviato" && valido_fino >= Today())))
                    },
                      If(
                        // c'è almeno una sponsorizzazione del preventivo che non è più disponibile?
                        CountRows(Filter(colRighe As r,
                          StartsWith(r.codice_voce, "SP-") &&
                          LookUp(colListinoVend, codice_voce = r.codice_voce).quantita_disponibile
                            - Sum(Filter('arcade.riga_contratto', codice_voce = r.codice_voce &&
                                    id_contratto in attivi.id_contratto), quantita)
                            - Sum(Filter('arcade.riga_preventivo', codice_voce = r.codice_voce &&
                                    id_preventivo in aperti.id_preventivo), quantita)
                            < r.quantita)) > 0,

                        Notify("Una sponsorizzazione del preventivo non è più disponibile: toglila prima di inviare",
                               NotificationType.Error),
                    With({ p: LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo) },
                      If(
                        // lo stand nel frattempo è stato opzionato o venduto?
                        !IsBlank(LookUp('arcade.contratto', id_edizione = p.id_edizione &&
                                   codice_stand = p.codice_stand && stato = "attivo")) ||
                        !IsBlank(LookUp('arcade.preventivo', id_edizione = p.id_edizione &&
                                   codice_stand = p.codice_stand && id_preventivo <> p.id_preventivo &&
                                   (stato = "in_approvazione" || (stato = "inviato" && valido_fino >= Today())))),
                          Notify("Lo stand non è più disponibile", NotificationType.Error),

                        IfError(
                          If(p.sconto_pct > SogliaApprovazione,
                            // sconto oltre il 10%: va al direttore commerciale
                            // (aggiungere in_approvazione_dal: Now() quando la colonna esiste)
                            Patch('arcade.preventivo', p, { stato: "in_approvazione" }),
                            // sconto fino al 10%: inviato e valido 30 giorni
                            Patch('arcade.preventivo', p, { stato: "inviato", inviato_il: Now(),
                              valido_fino: DateAdd(Today(), GiorniValidita, TimeUnit.Days) }));
                          Set(gblPreventivo, LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo));
                          Set(gblStato, gblPreventivo.stato);
                          Notify("Preventivo " & Substitute(gblStato, "_", " "), NotificationType.Success),

                          // errore: di solito l'indice univoco del database ha rifiutato
                          Notify("Lo stand è già opzionato da un altro preventivo", NotificationType.Error)
                        )
                      )
                    ))); Select(btnCaricaImpegni)
                  Text: ="Invia"
            - btnPerso:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: ="1"
                  BasePaletteColor: =nfStatoVenduto
                  Color: =nfColoreTestoSuAccento
                  DisplayMode: =If(gblStato = "inviato", DisplayMode.Edit, DisplayMode.Disabled)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =IfError(
                        Patch('arcade.preventivo',
                              LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo),
                              { stato: "perso" });
                        Set(gblPreventivo, LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo));
                        Set(gblStato, gblPreventivo.stato);
                        Notify("Preventivo segnato come perso: lo stand " & gblStand.codice_stand &
                               " torna libero", NotificationType.Information),

                        Notify("Operazione non riuscita: " & FirstError.Message, NotificationType.Error)
                    )
                  Text: ="Perso"
            - btnFirma:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: ="1"
                  BasePaletteColor: =nfAccentoContratti
                  Color: =nfColoreTestoSuAccento
                  DisplayMode: |-
                    =If(gblStato = "inviato" && Today() <= ChiusuraVendite &&
                         LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo).valido_fino >= Today(),
                         DisplayMode.Edit, DisplayMode.Disabled)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =// aggiorna la copia locale dei dati prima di calcolare numeri e controlli
                    Refresh('arcade.contratto'); Refresh('arcade.riga_contratto'); Refresh('arcade.pagamento');
                    With({
                        p: LookUp('arcade.preventivo', id_preventivo = gblIdPreventivo),
                        idC: "C" & EdizioneSel.id_edizione & "-" & Text(
                               Coalesce(Max(Filter('arcade.contratto', id_edizione = EdizioneSel.id_edizione),
                                            Value(Right(id_contratto, 4))), 0) + 1, "0000")
                    },
                    With({
                        acconto: Round(p.imponibile_eur * 0.3, 2),
                        tardi:   DateAdd(Today(), 15, TimeUnit.Days) > ScadenzaSaldo,
                        idPag:   Coalesce(Max('arcade.pagamento', id_pagamento), 0) + 1
                    },
                      IfError(
                        // ===================== RAMO "TUTTO BENE" =====================
                        // A - testata del contratto
                        Patch('arcade.contratto', Defaults('arcade.contratto'), {
                            id_contratto: idC, id_edizione: p.id_edizione, id_espositore: p.id_espositore,
                            id_preventivo: p.id_preventivo, codice_stand: p.codice_stand,
                            data_firma: Today(),
                            imponibile_listino_eur: p.imponibile_listino_eur,
                            sconto_pct: p.sconto_pct, imponibile_eur: p.imponibile_eur,
                            rinnovo: !IsBlank(LookUp('arcade.contratto', id_edizione = p.id_edizione - 1 &&
                                       id_espositore = p.id_espositore && stato = "attivo")),
                            metodo_abbinamento: "id da sistema sorgente",
                            aliquota_iva: p.aliquota_iva, stato: "attivo" });
                        // B - righe copiate dal preventivo
                        ForAll(Filter('arcade.riga_preventivo', id_preventivo = p.id_preventivo) As r,
                          Patch('arcade.riga_contratto', Defaults('arcade.riga_contratto'), {
                            id_contratto: idC, riga: r.riga, codice_voce: r.codice_voce,
                            descrizione: r.descrizione, quantita: r.quantita,
                            prezzo_unitario: r.prezzo_unitario, importo_eur: r.importo_eur }));
                        // C - preventivo accettato
                        Patch('arcade.preventivo', p, { stato: "accettato" });
                        // D - PIANO B: pagamenti (da sostituire con il flusso di Matteo)
                        Patch('arcade.pagamento', Defaults('arcade.pagamento'), {
                            id_pagamento: idPag, id_contratto: idC, tipo: "acconto",
                            scadenza: If(tardi, DateAdd(EdizioneSel.data_inizio, -15, TimeUnit.Days),
                                                DateAdd(Today(), 15, TimeUnit.Days)),
                            importo: acconto,
                            data_dedotta: false, annullato: false });
                        Patch('arcade.pagamento', Defaults('arcade.pagamento'), {
                            id_pagamento: idPag + 1, id_contratto: idC, tipo: "saldo",
                            scadenza: If(tardi, DateAdd(EdizioneSel.data_inizio, -15, TimeUnit.Days),
                                                ScadenzaSaldo),
                            importo: p.imponibile_eur - acconto,
                            data_dedotta: false, annullato: false });
                        Set(gblIdContratto, idC);
                        Notify("Contratto " & idC & " firmato", NotificationType.Success);
                        Navigate(scrContratto),
                        // ===================== RAMO "ERRORE" =====================
                        RemoveIf('arcade.pagamento', id_contratto = idC);
                        RemoveIf('arcade.contratto', id_contratto = idC);
                        Patch('arcade.preventivo', LookUp('arcade.preventivo', id_preventivo = p.id_preventivo),
                              { stato: "inviato" });
                        Notify("Firma non riuscita: " & FirstError.Message, NotificationType.Error)
                      )
                    ))
                  Text: ="Firma"
      - lblApprovato:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="Sconto approvato il " & Text(gblPreventivo.approvato_il, "dd/mm/yyyy") &
                If(IsBlank(gblPreventivo.approvato_da), "",
                   " da " & LookUp('arcade.utente', id_utente = gblPreventivo.approvato_da).email)
            Visible: =!IsBlank(gblPreventivo.approvato_il)
            X: =651
            Y: =564
      - btnCaricaImpegni:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |-
              =// contratti attivi dell'edizione e preventivi aperti (escluso quello corrente)
              ClearCollect(colContrattiVend,
                Filter('arcade.contratto', id_edizione = EdizioneSel.id_edizione && stato = "attivo"));
              ClearCollect(colPrevAperti,
                Filter('arcade.preventivo', id_edizione = EdizioneSel.id_edizione &&
                  id_preventivo <> Coalesce(gblIdPreventivo, -1) &&
                  (stato = "in_approvazione" || (stato = "inviato" && valido_fino >= Today()))));
              // quantità già occupate per ogni sponsorizzazione
              ClearCollect(colSponsorOccupati,
                ForAll(Filter(colListinoVend, tipo_voce = "sponsorizzazione") As v,
                  { codice_voce: v.codice_voce,
                    disponibili: v.quantita_disponibile
                      - Sum(Filter('arcade.riga_contratto', codice_voce = v.codice_voce &&
                              id_contratto in colContrattiVend.id_contratto), quantita)
                      - Sum(Filter('arcade.riga_preventivo', codice_voce = v.codice_voce &&
                              id_preventivo in colPrevAperti.id_preventivo), quantita) }))
            Visible: =false
            X: =233
            Y: =17
      - lblDispSponsor:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: |-
              =If(LookUp(colSponsorOccupati, codice_voce = cmbVoce.Selected.codice_voce).disponibili <= 0,
                         Color.Red, Color.DarkGreen)
            Height: =35
            Text: |-
              =With({ d: LookUp(colSponsorOccupati, codice_voce = cmbVoce.Selected.codice_voce).disponibili },
                If(d <= 0, "Esaurita", "Disponibili: " & d & " su " & cmbVoce.Selected.quantita_disponibile))
            Visible: =cmbVoce.Selected.tipo_voce = "sponsorizzazione"
            Width: =244
            X: =496
            Y: =476
