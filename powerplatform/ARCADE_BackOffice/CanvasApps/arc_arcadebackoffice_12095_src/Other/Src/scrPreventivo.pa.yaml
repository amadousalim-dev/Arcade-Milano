          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =nfColoreSuperficie
            Height: =649
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =nfRaggio
            RadiusBottomRight: =nfRaggio
            RadiusTopLeft: =nfRaggio
            RadiusTopRight: =nfRaggio
            Width: =890
            X: =476
            Y: =58
          Children:
            - conIntestRighe:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  FillPortions: =0
                  Height: =32
                  LayoutMinHeight: =32
                Children:
                  - Label7:
                      Control: Label@2.5.1
                      Properties:
                        Color: =nfColoreTestoSecondario
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =nfDimTesto
                        Text: ="Descrizione"
