                        X: =16
                  - lblIntQta:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =nfColoreTestoSecondario
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        PaddingLeft: =0
                        PaddingRight: =0
