                        X: =Parent.Width - 206
            - Gallery1:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  AccessibleLabel: ="1"
                  Fill: =nfColoreSuperficie
                  Items: =Sort(colRighe, riga)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  TabIndex: =1
                  TemplateSize: =60
                Children:
                  - lblRigaDescr:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =nfColoreTesto
                        FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                        Height: =Self.Size * 1.8
                        OnSelect: =
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =nfDimTesto
                        Text: =ThisItem.descrizione
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth - 462
                        X: =16
