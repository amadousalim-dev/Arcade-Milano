                  LayoutMinWidth: =16
                  OnChange: =Select(btnRicalcola)
                  Placeholder: ="Sconto in %"
            - lblAvvisoSconto:
                Control: Label@2.5.1
                Properties:
                  Color: =If(!gblTot.valido, nfColoreErrore, nfColoreAttenzione)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: |-
                    =If(!gblTot.valido, "Oltre il 20% non è possibile",
                               gblTot.serveApprovazione, "Oltre il 10%: il preventivo andrà al direttore commerciale",
                               "")
                  Width: =300
            - lblFedelta:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =nfAccentoContratti
                  FontWeight: =FontWeight.Semibold
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: |-
                    ="Rinnovo entro la prelazione: spetta lo sconto fedeltà del 5%"
                  Visible: |
                    =gblFedelta
                  Width: =200
